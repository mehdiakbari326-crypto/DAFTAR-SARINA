<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7B5EA7">
<title>دفتر روزانه سارینا</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#F8F4FC;--surface:#FFF;--ink:#2D1B4E;--muted:#7A6B8F;--line:#E8DFF5;--accent:#7B5EA7;--accent-soft:#F0E6FA;--accent-deep:#5C3D8A;--pos:#2E9E6A;--pos-soft:#E0F5EB;--neg:#D45A3A;--neg-soft:#FDE8E2;--pink:#E89AB8;--pink-soft:#FCEAF2;--font:'Vazirmatn',Tahoma,system-ui,sans-serif;--r:18px;--shadow:0 4px 16px rgba(123,94,167,.1)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.7;min-height:100dvh}button,input{font:inherit;color:inherit}button{cursor:pointer}
.shell{max-width:560px;margin:0 auto;display:grid;gap:16px;padding:16px 16px 56px}
.hero{background:linear-gradient(135deg,var(--accent),#9B7AD4 50%,var(--pink));border-radius:24px;padding:20px 18px 16px;color:#fff;box-shadow:var(--shadow)}
.hero h1{margin:0;font-size:18px;font-weight:800}.hero .sub{font-size:13px;opacity:.9;margin:0 0 12px}
.name{font-weight:800;font-size:20px;width:min(12em,100%);background:rgba(255,255,255,.2);border:0;border-radius:12px;padding:6px 12px;color:#fff}
.role-badge{display:inline-flex;background:rgba(255,255,255,.22);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:700}
.role-badge.parent{background:rgba(232,184,74,.35)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:4px;background:rgba(255,255,255,.18);border-radius:14px}
.tabs button{border:0;background:transparent;padding:8px 2px;border-radius:11px;font-weight:700;font-size:12px;color:rgba(255,255,255,.85);min-height:40px}
.tabs button[aria-selected=true]{background:#fff;color:var(--accent-deep)}
main{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between}.card-h h2{margin:0;font-size:16px;font-weight:800}
.muted{color:var(--muted);font-size:13.5px;margin:0}
.btn{min-height:44px;border:0;border-radius:12px;padding:6px 18px;font-weight:700;background:var(--accent);color:#fff}
.btn.pink{background:var(--pink)}.ghost{border:1px solid var(--line);background:transparent;border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:600;min-height:34px}
.inp{min-width:0;min-height:44px;border:1.5px solid var(--line);border-radius:12px;padding:6px 12px;background:var(--bg)}
form.add{display:grid;grid-template-columns:1fr auto;gap:8px}form.add3{display:grid;grid-template-columns:1fr 84px auto;gap:8px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.task{display:grid;gap:8px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px}
.task.s-done{border-color:var(--pos);background:var(--pos-soft)}.task.s-missed{border-color:var(--neg);background:var(--neg-soft)}
.task-t{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:40px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;font-weight:700;font-size:13px}
.seg .ok[aria-pressed=true]{background:var(--pos);border-color:var(--pos);color:#fff}.seg .no[aria-pressed=true]{background:var(--neg);border-color:var(--neg);color:#fff}
.seg .ok:not([aria-pressed=true]){color:var(--pos)}.seg .no:not([aria-pressed=true]){color:var(--neg)}
.del{border:1px solid var(--neg);color:var(--neg);background:transparent;border-radius:8px;padding:2px 10px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1.5px dashed var(--line);background:transparent;border-radius:99px;padding:4px 12px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;background:var(--surface);border-radius:var(--r);border:1px solid var(--line);padding:12px 4px}
.stats .lab{font-size:11px;color:var(--muted)}.stats b{font-size:20px}.stats .p b{color:var(--pos)}.stats .n b{color:var(--neg)}.stats .s b{color:var(--accent)}
.week{padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.rate-h{display:flex;justify-content:space-between;font-size:13.5px}.bar{height:9px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--pink))}
.unlock-banner{background:linear-gradient(135deg,var(--pink-soft),var(--accent-soft));border:1.5px solid var(--pink);border-radius:var(--r);padding:14px;text-align:center}
.reward{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.reward .r-t{font-weight:700}.reward .r-t small{display:block;color:var(--muted);font-size:12.5px}
.claim-btn{min-height:38px;border:0;border-radius:11px;padding:4px 14px;font-weight:700;background:var(--accent);color:#fff}.claim-btn:disabled{background:var(--line);color:var(--muted)}
.note{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.pill{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800}.pill.p{background:var(--pos-soft);color:var(--pos)}.pill.n{background:var(--neg-soft);color:var(--neg)}
.parent-task{padding:12px 14px;border:1.5px dashed var(--pink);border-radius:14px;background:var(--pink-soft)}.parent-task.done{border-style:solid;border-color:var(--pos);background:var(--pos-soft)}
.modal-backdrop{position:fixed;inset:0;background:rgba(45,27,78,.45);display:grid;place-items:center;z-index:100;padding:20px}
.modal{background:var(--surface);border-radius:22px;padding:24px 20px;width:min(340px,100%);display:grid;gap:14px;text-align:center}
.pin-row{display:flex;gap:8px;justify-content:center}.pin-row input{width:48px;height:52px;text-align:center;font-size:22px;font-weight:800;border:2px solid var(--line);border-radius:12px;background:var(--bg)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent-deep);color:#fff;padding:12px 20px;border-radius:99px;font-weight:700;z-index:200;max-width:90%;text-align:center}
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;background:#aaa}.sync-dot.on{background:#2E9E6A}.sync-dot.off{background:#D45A3A}
.foot{display:grid;gap:10px;padding-top:4px}.foot-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.rule{font-size:12.5px;color:var(--muted);margin:0;text-align:center}
.datebar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--surface)}.badge{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:1px 10px;border-radius:99px}
.type{display:grid;grid-template-columns:1fr 1fr;gap:6px}.type button{min-height:40px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-weight:700;color:var(--muted)}.type .tp[aria-pressed=true]{background:var(--pos-soft);border-color:var(--pos);color:var(--pos)}.type .tn[aria-pressed=true]{background:var(--neg-soft);border-color:var(--neg);color:var(--neg)}
</style>
</head>
<body>
<div id="app" dir="rtl"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
document.documentElement.setAttribute('dir','rtl');
const firebaseConfig={apiKey:"AIzaSyBvQEV428AMGvYa6Ztkqxzm3K_iLcZAqm0",authDomain:"sarina-daftar.firebaseapp.com",databaseURL:"https://sarina-daftar-default-rtdb.firebaseio.com",projectId:"sarina-daftar",storageBucket:"sarina-daftar.firebasestorage.app",messagingSenderId:"912685467959",appId:"1:912685467959:web:bef6f3cf3ee6f8f25432b2",measurementId:"G-LGLGCM8KWX"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const FAMILY_PATH='family/sarina';
var PRESET_TASKS=['مسواک زدن صبح','مسواک زدن شب','انجام تکالیف مدرسه','مرتب کردن اتاق','جمع کردن تخت','کتاب خواندن ۲۰ دقیقه'];
var PRESET_POS=['کمک در کارهای خانه','مهربانی با دیگران','راستگویی','ادب و تشکر','تلاش و پشتکار'];
var PRESET_NEG=['دروغ گفتن','بی‌احترامی','لجبازی','دعوا کردن','حرف گوش نکردن'];
var PRESET_PARENT=['باهام قصه بخون','باهام بازی کن','منو ببر پارک','باهم فیلم ببینیم','بستنی بخوریم'];
var MOTIVATE=['آفرین سارینا! تو فوق‌العاده‌ای 💜','وای چه دختر زرنگی! ✨','ادامه‌ش بده قهرمانم! 🌟','سارینا جون، عالی پیش میری 💕'];
var PRESET_REWARDS=[{t:'انتخاب فیلم شب',c:6},{t:'بستنی',c:8},{t:'یک ساعت بازی',c:10},{t:'گردش آخر هفته',c:25}];
function pad(n){return String(n).padStart(2,'0')}
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fromKey(k){var p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12)}
function addDays(k,n){var d=fromKey(k);d.setDate(d.getDate()+n);return keyOf(d)}
function todayKey(){return keyOf(new Date())}
function fa(n){return Number(n).toLocaleString('fa-IR')}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function mkFmt(o){try{return new Intl.DateTimeFormat('fa-IR-u-ca-persian',o)}catch(e){return new Intl.DateTimeFormat('fa-IR',o)}}
var fmtFull=mkFmt({weekday:'long',day:'numeric',month:'long',year:'numeric'});
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function fmtSigned(n){return (n>0?'+':'')+fa(n)}
function toNum(s){var m=String(s||'').replace(/[۰-۹]/g,function(c){return c.charCodeAt(0)-1776}).replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632});var n=parseInt(m,10);return isNaN(n)?0:Math.max(0,Math.min(9999,n))}
function toEnDigits(s){return String(s||'').replace(/[۰-۹]/g,function(c){return String(c.charCodeAt(0)-1776)}).replace(/[٠-٩]/g,function(c){return String(c.charCodeAt(0)-1632)})}
var S={name:'سارینا',tasks:[],days:{},rewards:[],claims:[],goal:15,parentTasks:[],parentPin:'1234'};
var view='today',curKey=todayKey(),draftType='pos',draftText='',isParent=false,showPinModal=false,toastMsg='',toastTimer=null,syncStatus='connecting',ignoreRemote=false;
var app=document.getElementById('app');
var LS='daftar-sarina-v2';
function lsLoad(){try{var j=JSON.parse(localStorage.getItem(LS));if(j){S.name=j.name||'سارینا';S.tasks=j.tasks||[];S.days=j.days||{};S.rewards=j.rewards||[];S.claims=j.claims||[];S.goal=j.goal||15;S.parentTasks=j.parentTasks||[];S.parentPin=j.parentPin||'1234'}}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function saveProfile(){lsSave();if(db){ignoreRemote=true;db.ref(FAMILY_PATH).set(S).then(function(){ignoreRemote=false;syncStatus='online';updateSyncDot()}).catch(function(){ignoreRemote=false;syncStatus='offline';updateSyncDot()})}}
function startFirebaseSync(){db.ref(FAMILY_PATH).on('value',function(snap){if(ignoreRemote)return;var r=snap.val();if(r){S.name=r.name||S.name;S.tasks=r.tasks||S.tasks;S.days=r.days||S.days;S.rewards=r.rewards||S.rewards;S.claims=r.claims||S.claims;S.goal=r.goal||S.goal;S.parentTasks=r.parentTasks||S.parentTasks;S.parentPin=r.parentPin||S.parentPin;lsSave();render()}syncStatus='online';updateSyncDot()},function(){syncStatus='offline';updateSyncDot()})}
function updateSyncDot(){var el=document.getElementById('syncDot');if(el)el.className='sync-dot '+(syncStatus==='online'?'on':syncStatus==='offline'?'off':'')}
function getDay(k){return S.days[k]||{tasks:{},notes:[]}}
function mutDay(k,fn){var d=JSON.parse(JSON.stringify(getDay(k)));d.tasks=d.tasks||{};d.notes=d.notes||[];fn(d);S.days[k]=d;saveProfile();render()}
function dayTaskList(k){var rec=getDay(k).tasks||{};return S.tasks.map(function(t){return{id:t.id,title:t.title,s:rec[t.id]&&rec[t.id].s}})}
function dayStats(k){var list=dayTaskList(k);var d=getDay(k);var done=list.filter(function(t){return t.s==='done'}).length;var pos=(d.notes||[]).filter(function(n){return n.type==='pos'}).length;var neg=(d.notes||[]).length-pos;return{done:done,pos:pos,neg:neg}}
function score(s){return s.done+s.pos-s.neg}
function totalScore(){var t=0;Object.keys(S.days).forEach(function(k){t+=score(dayStats(k))});return t}
function weekScore(){var t=0;for(var i=0;i<7;i++)t+=score(dayStats(addDays(todayKey(),-i)));return t}
function availablePoints(){return Math.max(0,totalScore()-(S.claims||[]).reduce(function(a,c){return a+(c.c||0)},0))}
function showToast(msg){toastMsg=msg;clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastMsg='';render()},2500);render()}
function header(){var role=isParent?'<span class="role-badge parent">👨‍👩‍👧 والدین</span>':'<span class="role-badge">👧 سارینا</span>';return '<header class="hero"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h1>دفتر روزانه سارینا <span id="syncDot" class="sync-dot"></span></h1>'+role+'</div><p class="sub">هر کار خوب = یک ستاره بنفش ✨</p><input id="nameIn" class="name" value="'+esc(S.name)+'" '+(isParent?'':'readonly')+'><div class="tabs"><button data-act="view" data-v="today" aria-selected="'+(view==='today')+'">امروز</button><button data-act="view" data-v="report" aria-selected="'+(view==='report')+'">گزارش</button><button data-act="view" data-v="rewards" aria-selected="'+(view==='rewards')+'">پاداش</button><button data-act="view" data-v="parent" aria-selected="'+(view==='parent')+'">مامان‌بابا</button><button data-act="view" data-v="settings" aria-selected="'+(view==='settings')+'">تنظیمات</button></div></header>'}
function weekBox(){var ws=weekScore(),g=S.goal||15,p=Math.min(100,Math.round(ws/g*100));var h='<div class="week"><div class="rate-h"><span>امتیاز این هفته</span><b>'+fa(ws)+' از '+fa(g)+'</b></div><div class="bar"><i style="width:'+p+'%"></i></div>';if(ws>=g)h+='<p style="color:var(--pos);font-weight:700;margin:8px 0 0">🎉 هدف کامل شد</p>';return h+'</div>'}
function todayView(){var k=curKey,isToday=k===todayKey(),list=dayTaskList(k),d=getDay(k),st=dayStats(k),h='';h+='<div class="datebar"><button class="icon" data-act="day" data-n="-1">›</button><div style="text-align:center"><strong>'+fmtFull.format(fromKey(k))+'</strong>'+(isToday?'<div class="badge">امروز</div>':'')+'</div><button class="icon" data-act="day" data-n="1"'+(isToday?' disabled':'')+'>‹</button></div>';h+='<section class="stats"><div><span class="lab">انجام‌شده</span><b>'+fa(st.done)+'</b></div><div class="p"><span class="lab">مثبت</span><b>'+fa(st.pos)+'</b></div><div class="n"><span class="lab">منفی</span><b>'+fa(st.neg)+'</b></div><div class="s"><span class="lab">امتیاز</span><b>'+fmtSigned(score(st))+'</b></div></section>'+weekBox();h+='<section class="card"><div class="card-h"><h2>✅ تسک‌های روز</h2></div>';if(!list.length)h+='<p class="muted">از تنظیمات تسک اضافه کن.</p>';else h+='<ul>'+list.map(function(t){var cls=t.s==='done'?' s-done':t.s==='missed'?' s-missed':'';return '<li class="task'+cls+'"><div class="task-t"><span>'+esc(t.title)+'</span></div><div class="seg"><button class="ok" data-act="mark" data-s="done" data-id="'+esc(t.id)+'" aria-pressed="'+(t.s==='done')+'">✓ انجام شد</button><button class="no" data-act="mark" data-s="missed" data-id="'+esc(t.id)+'" aria-pressed="'+(t.s==='missed')+'">✕ انجام نشد</button></div></li>'}).join('')+'</ul>';h+='</section>';h+='<section class="card"><div class="card-h"><h2>🌸 رفتارهای امروز</h2></div><div class="type"><button class="tp" data-act="type" data-t="pos" aria-pressed="'+(draftType==='pos')+'">مثبت 💚</button><button class="tn" data-act="type" data-t="neg" aria-pressed="'+(draftType==='neg')+'">منفی 🧡</button></div>';var chips=draftType==='pos'?PRESET_POS:PRESET_NEG;h+='<div class="chips">'+chips.map(function(c){return '<button class="chip" data-act="chip" data-t="'+esc(c)+'">'+esc(c)+'</button>'}).join('')+'</div>';h+='<form class="add" id="noteForm"><input id="noteIn" class="inp" placeholder="رفتار دیگر..." value="'+esc(draftText)+'"><button class="btn" type="submit">ثبت</button></form>';var notes=(d.notes||[]).slice().reverse();if(notes.length)h+='<div>'+notes.map(function(n){return '<div class="note"><span class="pill '+(n.type==='pos'?'p':'n')+'">'+(n.type==='pos'?'+':'−')+'</span><div>'+esc(n.t)+'</div><button class="del" data-act="del-note" data-id="'+esc(n.id)+'">×</button></div>'}).join('')+'</div>';h+='</section>';return h}
function reportView(){return '<section class="card"><div class="card-h"><h2>📊 گزارش</h2></div><p class="muted">امتیاز کل: <b>'+fa(totalScore())+'</b> | این هفته: <b>'+fa(weekScore())+'</b></p></section>'}
function rewardsView(){var pts=availablePoints(),h='<section class="card"><div class="card-h"><h2>🎁 پاداش‌ها</h2></div><p class="muted">امتیاز قابل استفاده: <strong style="color:var(--accent)">'+fa(pts)+'</strong></p>';if(!S.rewards.length)h+='<p class="muted">از تنظیمات پاداش اضافه کن.</p>';else h+=S.rewards.map(function(r){return '<div class="reward"><div class="r-t">'+esc(r.t)+'<small>'+fa(r.c)+' امتیاز</small></div><button class="claim-btn" data-act="claim" data-id="'+esc(r.id)+'" '+(pts<r.c?'disabled':'')+'>دریافت</button></div>'}).join('');return h+'</section>'}
function parentView(){var ws=weekScore(),g=S.goal||15,unlocked=ws>=g,h='';if(!unlocked)h+='<div class="unlock-banner"><strong>🔒 هنوز قفل است</strong><p>وقتی امتیاز هفته به <b>'+fa(g)+'</b> برسد باز می‌شود.</p><p style="font-size:20px;font-weight:800;color:var(--accent)">'+fa(ws)+' / '+fa(g)+'</p></div>';else{h+='<div class="unlock-banner" style="border-color:var(--pos)"><strong>🎉 باز شد!</strong></div>';if(!isParent)h+='<section class="card"><div class="card-h"><h2>💝 کار برای والدین</h2></div><div class="chips">'+PRESET_PARENT.map(function(p){return '<button class="chip" data-act="chip-parent" data-t="'+esc(p)+'">+ '+esc(p)+'</button>'}).join('')+'</div><form class="add" id="parentForm"><input id="parentIn" class="inp" placeholder="کار دلخواه..."><button class="btn pink" type="submit">ثبت</button></form></section>'}h+='<section class="card"><div class="card-h"><h2>👨‍👩‍👧 کارهای مامان و بابا</h2></div>';if(!S.parentTasks.length)h+='<p class="muted">هنوز کاری نیست.</p>';else h+='<ul>'+S.parentTasks.map(function(pt){return '<li class="parent-task'+(pt.done?' done':'')+'"><div style="font-weight:700">'+(pt.done?'✅ ':'⏳ ')+esc(pt.t)+'</div>'+(isParent&&!pt.done?'<button class="btn" style="margin-top:8px" data-act="done-parent" data-id="'+esc(pt.id)+'">انجام دادم</button>':'')+'</li>'}).join('')+'</ul>';return h+'</section>'}
function settingsView(){if(!isParent)return '<section class="card"><div class="card-h"><h2>⚙️ تنظیمات</h2></div><p class="muted">برای دسترسی وارد حالت والدین شوید.</p><button class="btn" data-act="enter-parent" style="width:100%;margin-top:12px">ورود والدین</button></section>';var h='';h+='<section class="card"><div class="card-h"><h2>✅ مدیریت تسک‌ها</h2></div>';if(S.tasks.length)h+='<ul>'+S.tasks.map(function(t){return '<li class="task" style="padding:10px"><div class="task-t"><span>'+esc(t.title)+'</span><button class="del" data-act="del-task-perm" data-id="'+esc(t.id)+'">حذف</button></div></li>'}).join('')+'</ul>';else h+='<p class="muted">تسکی نیست.</p>';h+='<form class="add" id="taskFormSet" style="margin-top:10px"><input id="taskInSet" class="inp" placeholder="تسک جدید..."><button class="btn" type="submit">افزودن</button></form>';h+='<div class="chips" style="margin-top:8px">'+PRESET_TASKS.filter(function(p){return !S.tasks.some(function(t){return t.title===p})}).map(function(p){return '<button class="chip" data-act="chip-task-set" data-t="'+esc(p)+'">+ '+esc(p)+'</button>'}).join('')+'</div></section>';h+='<section class="card"><div class="card-h"><h2>🎁 مدیریت پاداش‌ها</h2></div>';if(S.rewards.length)h+=S.rewards.map(function(r){return '<div class="reward"><div class="r-t">'+esc(r.t)+'<small>'+fa(r.c)+' امتیاز</small></div><button class="del" data-act="del-reward" data-id="'+esc(r.id)+'">حذف</button></div>'}).join('');else h+='<p class="muted">پاداشی نیست.</p>';h+='<form class="add3" id="rewardFormSet" style="margin-top:10px"><input class="inp" id="rewInSet" placeholder="نام پاداش"><input class="inp" id="costInSet" placeholder="امتیاز" inputmode="numeric"><button class="btn" type="submit">+</button></form>';h+='<div class="chips" style="margin-top:8px">'+PRESET_REWARDS.map(function(r){return '<button class="chip" data-act="chip-rew-set" data-t="'+esc(r.t)+'" data-c="'+r.c+'">+ '+esc(r.t)+'</button>'}).join('')+'</div></section>';h+='<section class="card"><div class="card-h"><h2>🎯 هدف هفتگی</h2></div><form class="add" id="goalFormSet"><input class="inp" id="goalInSet" type="number" min="5" max="100" value="'+(S.goal||15)+'"><button class="btn" type="submit">ذخیره</button></form></section>';h+='<section class="card"><div class="card-h"><h2>🔐 رمز والدین</h2></div><p class="muted">رمز فعلی: <b>'+esc(String(S.parentPin||'1234'))+'</b></p><button class="btn" data-act="change-pin" style="width:100%">تغییر رمز</button></section>';return h}
function pinModal(){if(!showPinModal)return '';return '<div class="modal-backdrop" id="pinBackdrop"><div class="modal" id="pinModalBox"><h3>🔒 ورود والدین</h3><p>رمز ۴ رقمی<br><small style="color:var(--muted)">پیش‌فرض: ۱۲۳۴</small></p><div class="pin-row"><input id="pin1" maxlength="1" inputmode="numeric" autocomplete="off"><input id="pin2" maxlength="1" inputmode="numeric" autocomplete="off"><input id="pin3" maxlength="1" inputmode="numeric" autocomplete="off"><input id="pin4" maxlength="1" inputmode="numeric" autocomplete="off"></div><p id="pinErr" style="color:var(--neg);display:none;margin:0"></p><button class="btn" id="pinSubmit" style="width:100%">ورود</button><button class="ghost" id="pinCancel" style="justify-content:center">انصراف</button></div></div>'}
function render(){var foot='<div class="foot"><div class="foot-actions">';if(isParent)foot+='<button class="ghost" data-act="exit-parent">خروج والدین</button>';else foot+='<button class="ghost" data-act="enter-parent">🔒 ورود والدین</button>';foot+='</div><p class="rule">دفتر روزانه سارینا • آنلاین با 💜</p></div>';var body=view==='today'?todayView():view==='report'?reportView():view==='rewards'?rewardsView():view==='settings'?settingsView():parentView();app.innerHTML='<div class="shell">'+header()+'<main>'+body+'</main>'+foot+'</div>'+pinModal()+(toastMsg?'<div class="toast">'+esc(toastMsg)+'</div>':'');updateSyncDot();if(showPinModal){setTimeout(function(){var p1=document.getElementById('pin1'),p2=document.getElementById('pin2'),p3=document.getElementById('pin3'),p4=document.getElementById('pin4');var pins=[p1,p2,p3,p4];pins.forEach(function(el,i){if(!el)return;el.addEventListener('input',function(){var v=toEnDigits(el.value).replace(/[^0-9]/g,'').slice(-1);el.value=v;if(v&&i<3&&pins[i+1])pins[i+1].focus()});el.addEventListener('keydown',function(e){if(e.key==='Backspace'&&!el.value&&i>0)pins[i-1].focus()})});var submitBtn=document.getElementById('pinSubmit');if(submitBtn){submitBtn.onclick=function(){var code=toEnDigits((p1&&p1.value||'')+(p2&&p2.value||'')+(p3&&p3.value||'')+(p4&&p4.value||''));var err=document.getElementById('pinErr');if(code.length<4){if(err){err.style.display='block';err.textContent='هر ۴ رقم را وارد کنید'}return}if(code===String(S.parentPin||'1234')){isParent=true;showPinModal=false;showToast('خوش آمدید والدین 💜');render()}else{if(err){err.style.display='block';err.textContent='رمز اشتباه است'}pins.forEach(function(el){if(el)el.value=''});if(p1)p1.focus()}}}var cancelBtn=document.getElementById('pinCancel');if(cancelBtn)cancelBtn.onclick=function(){showPinModal=false;render()};var backdrop=document.getElementById('pinBackdrop');if(backdrop)backdrop.onclick=function(e){if(e.target===backdrop){showPinModal=false;render()}};if(p1)p1.focus()},30)}}
app.addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(!t)return;var a=t.getAttribute('data-act'),d=t.dataset;if(a==='view'){view=d.v;render();return}if(a==='day'){curKey=addDays(curKey,+d.n);render();return}if(a==='type'){draftType=d.t;render();return}if(a==='mark'){mutDay(curKey,function(day){if(!day.tasks[d.id])day.tasks[d.id]={t:(S.tasks.find(function(x){return x.id===d.id})||{}).title||''};if(day.tasks[d.id].s===d.s)delete day.tasks[d.id].s;else day.tasks[d.id].s=d.s});if(d.s==='done')showToast(MOTIVATE[Math.floor(Math.random()*MOTIVATE.length)]);return}if(a==='del-note'){mutDay(curKey,function(day){day.notes=(day.notes||[]).filter(function(n){return n.id!==d.id})});return}if(a==='chip'){draftText=d.t;var ni=document.getElementById('noteIn');if(ni)ni.value=d.t;return}if(a==='claim'){var rew=S.rewards.find(function(r){return r.id===d.id});if(!rew||availablePoints()<rew.c)return;S.claims=S.claims||[];S.claims.push({id:rew.id,t:rew.t,c:rew.c,k:todayKey()});saveProfile();showToast('پاداش دریافت شد! 🎁');render();return}if(a==='chip-parent'){var pi=document.getElementById('parentIn');if(pi)pi.value=d.t;return}if(a==='done-parent'){var pt=S.parentTasks.find(function(p){return p.id===d.id});if(pt){pt.done=true;saveProfile();showToast('آفرین!');render()}return}if(a==='enter-parent'){showPinModal=true;render();return}if(a==='exit-parent'){isParent=false;showToast('حالت سارینا');render();return}if(a==='change-pin'){var np=prompt('رمز جدید ۴ رقمی:');if(np===null)return;np=toEnDigits(np).replace(/[^0-9]/g,'');if(np.length!==4){showToast('باید ۴ رقم باشد');return}S.parentPin=np;saveProfile();showToast('رمز تغییر کرد');return}if(a==='del-task-perm'){if(confirm('این تسک حذف شود؟')){S.tasks=S.tasks.filter(function(t){return t.id!==d.id});saveProfile();render()}return}if(a==='del-reward'){if(confirm('این پاداش حذف شود؟')){S.rewards=S.rewards.filter(function(r){return r.id!==d.id});saveProfile();render()}return}if(a==='chip-task-set'){if(d.t&&!S.tasks.some(function(t){return t.title===d.t})){S.tasks.push({id:uid(),title:d.t});saveProfile();render()}return}if(a==='chip-rew-set'){S.rewards.push({id:uid(),t:d.t,c:+d.c||5});saveProfile();render();return}});
app.addEventListener('submit',function(e){e.preventDefault();var form=e.target;if(form.id==='noteForm'){var txt=(document.getElementById('noteIn').value||'').trim();if(!txt)return;mutDay(curKey,function(day){day.notes=day.notes||[];day.notes.push({id:uid(),t:txt,type:draftType,ts:Date.now()})});draftText='';if(draftType==='pos')showToast(MOTIVATE[Math.floor(Math.random()*MOTIVATE.length)]);return}if(form.id==='parentForm'){var pt=(document.getElementById('parentIn').value||'').trim();if(!pt)return;if(weekScore()<(S.goal||15)){showToast('هنوز به هدف نرسیدی');return}S.parentTasks=S.parentTasks||[];S.parentTasks.unshift({id:uid(),t:pt,k:todayKey(),done:false});saveProfile();showToast('کار ثبت شد 💝');render();return}if(form.id==='taskFormSet'){var title=(document.getElementById('taskInSet').value||'').trim();if(!title)return;S.tasks.push({id:uid(),title:title});saveProfile();render();return}if(form.id==='rewardFormSet'){var rt=(document.getElementById('rewInSet').value||'').trim();var rc=toNum(document.getElementById('costInSet').value);if(!rt||!rc)return;S.rewards.push({id:uid(),t:rt,c:rc});saveProfile();render();return}if(form.id==='goalFormSet'){var g=toNum(document.getElementById('goalInSet').value);if(g>=5){S.goal=g;saveProfile();showToast('هدف ذخیره شد');render()}return}});
app.addEventListener('change',function(e){if(e.target.id==='nameIn'&&isParent){S.name=e.target.value.trim()||'سارینا';saveProfile()}});
lsLoad();if(!S.tasks.length){S.tasks=[{id:uid(),title:'مسواک زدن صبح'},{id:uid(),title:'مسواک زدن شب'},{id:uid(),title:'انجام تکالیف'},{id:uid(),title:'مرتب کردن اتاق'}];lsSave()}render();startFirebaseSync();
</script>
