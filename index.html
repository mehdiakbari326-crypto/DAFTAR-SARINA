<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9B6DFF">
<title>دفتر روزانه سارینا</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap">
<style>
:root,[data-theme="unicorn"]{--bg:#FBF7FF;--surface:#FFF;--ink:#2D1B4E;--muted:#8B7AA8;--line:#EDE4FF;--accent:#9B6DFF;--accent-soft:#F3ECFF;--accent-deep:#6B3FBF;--pos:#2E9E6A;--pos-soft:#E0F5EB;--neg:#E86A4A;--neg-soft:#FDE8E2;--pink:#FF8BC2;--pink-soft:#FFEAF4;--gold:#FFC94A;--gold-soft:#FFF6D6;--hero:linear-gradient(145deg,#A78BFA 0%,#C084FC 40%,#F472B6 100%);--font:'Vazirmatn',Tahoma,system-ui,sans-serif;--r:20px;--shadow:0 10px 28px rgba(155,109,255,.18)}
[data-theme="princess"]{--bg:#FFF5F8;--surface:#FFF;--ink:#4A1C40;--muted:#A87A96;--line:#FFE0EC;--accent:#E85A9B;--accent-soft:#FFE8F2;--accent-deep:#B83D72;--hero:linear-gradient(145deg,#E85A9B,#FF8BC2 50%,#FFB6D9)}
[data-theme="ocean"]{--bg:#F0F9FF;--surface:#FFF;--ink:#0C3B5E;--muted:#5A8AAB;--line:#D6EEFF;--accent:#3B9EFF;--accent-soft:#E5F4FF;--accent-deep:#1A6FBF;--hero:linear-gradient(145deg,#3B9EFF,#5EC8FF 50%,#7DD3FC)}
[data-theme="forest"]{--bg:#F3FBF5;--surface:#FFF;--ink:#1A3D2B;--muted:#5A8A6E;--line:#D4F0DC;--accent:#3DBF6E;--accent-soft:#E5F8EC;--accent-deep:#1E8A4A;--hero:linear-gradient(145deg,#3DBF6E,#6ED99A 50%,#A7F3C0)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.7;min-height:100dvh}button,input{font:inherit;color:inherit}button{cursor:pointer;border:0}
.shell{max-width:560px;margin:0 auto;display:grid;gap:14px;padding:14px 14px 70px}
/* FUN HERO */
.hero,.fun-hero{position:relative;overflow:hidden;background:var(--hero);border-radius:28px;padding:18px 14px 12px;color:#fff;box-shadow:var(--shadow)}
.fun-hero:before{content:'';position:absolute;inset:-40% -20% auto;height:80%;background:radial-gradient(circle at 30% 40%,rgba(255,255,255,.25),transparent 55%);pointer-events:none}
.sparkle{position:absolute;font-size:16px;opacity:.85;animation:twinkle 2.4s ease-in-out infinite;pointer-events:none}
.sparkle.s1{top:12px;left:14px}.sparkle.s2{top:28px;right:60px;animation-delay:.4s}.sparkle.s3{bottom:50px;left:40%;animation-delay:.8s}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0);opacity:.6}50%{transform:scale(1.25) rotate(12deg);opacity:1}}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;position:relative;z-index:1}
.hero-titles{flex:1}.hero-badge{display:inline-block;background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.45);border-radius:99px;padding:3px 12px;font-size:11px;font-weight:800;margin-bottom:6px;backdrop-filter:blur(4px)}
.mascot{font-size:48px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.15));position:relative;z-index:1}
.mascot.bounce{animation:float 2.6s ease-in-out infinite}
@keyframes@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hero h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.2px}.hero .sub{font-size:12.5px;opacity:.95;margin:3px 0 0;font-weight:600}
.greet,.fun-greet{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);border-radius:18px;padding:10px 14px;margin:10px 0 8px;font-size:13.5px;font-weight:700;position:relative;z-index:1;backdrop-filter:blur(4px)}
.name-wrap{position:relative;z-index:1;margin-bottom:10px}
.name-star{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none}
.name{font-weight:800;font-size:17px;width:100%;background:rgba(255,255,255,.28);border:2px solid rgba(255,255,255,.4);border-radius:16px;padding:10px 40px 10px 14px;color:#fff;text-align:center}
.name::placeholder{color:rgba(255,255,255,.7)}
/* FUN TABS */
.tabs,.fun-tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:5px;background:rgba(255,255,255,.2);border-radius:20px;position:relative;z-index:1;border:1px solid rgba(255,255,255,.25)}
.tabs button,.fun-tabs button{background:transparent;padding:8px 2px 6px;border-radius:14px;font-weight:800;font-size:10px;color:rgba(255,255,255,.9);min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .15s,background .15s}
.fun-tabs button .tab-icon{font-size:18px;line-height:1;display:block}
.fun-tabs button .tab-lab{font-size:10px;line-height:1.2}
.tabs button[aria-selected=true],.fun-tabs button[aria-selected=true]{background:#fff;color:var(--accent-deep);box-shadow:0 4px 12px rgba(0,0,0,.12);transform:translateY(-2px)}
.tabs button[aria-selected=true] .tab-icon,.fun-tabs button[aria-selected=true] .tab-icon{transform:scale(1.15)}
.level-card,.card,.week,.stats{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.level-card{padding:14px 16px;display:grid;gap:8px}
.level-row{display:flex;align-items:center;justify-content:space-between}.level-badge{display:flex;align-items:center;gap:8px}.level-icon{font-size:28px}
.level-info strong{display:block;font-size:15px}.level-info span{font-size:12px;color:var(--muted)}
.streak{background:var(--gold-soft);color:#B8860B;border-radius:99px;padding:5px 12px;font-weight:800;font-size:13px}
.xp-bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.xp-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--pink));border-radius:99px}
.card{padding:16px;display:grid;gap:12px}.card-h h2{margin:0;font-size:15.5px;font-weight:800}
.muted{color:var(--muted);font-size:13px;margin:0}
.btn{min-height:44px;border-radius:14px;padding:6px 18px;font-weight:700;background:var(--accent);color:#fff}.btn.pink{background:var(--pink)}
.ghost{border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:600}
.inp{min-height:44px;border:1.5px solid var(--line);border-radius:14px;padding:6px 12px;background:var(--bg)}
form.add{display:grid;grid-template-columns:1fr auto;gap:8px}form.add3{display:grid;grid-template-columns:1fr 80px auto;gap:8px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.task{display:grid;gap:8px;padding:14px;border:2px solid var(--line);border-radius:18px}.task.s-done{border-color:var(--pos);background:var(--pos-soft)}.task.s-missed{border-color:var(--neg);background:var(--neg-soft)}
.task-t{display:flex;justify-content:space-between;font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg button{min-height:42px;border:2px solid var(--line);background:var(--surface);border-radius:14px;font-weight:700;font-size:13px}
.seg .ok[aria-pressed=true]{background:var(--pos);border-color:var(--pos);color:#fff}.seg .no[aria-pressed=true]{background:var(--neg);border-color:var(--neg);color:#fff}
.del{border:1.5px solid var(--neg);color:var(--neg);background:transparent;border-radius:10px;padding:3px 10px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1.5px dashed var(--line);background:transparent;border-radius:99px;padding:5px 13px;font-size:13px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(5,1fr);text-align:center;padding:12px 4px}.stats .lab{font-size:10px;color:var(--muted)}.stats b{font-size:18px;font-weight:800}
.week{padding:14px 16px}.bar{height:11px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--pink),var(--gold));border-radius:99px}
.unlock-banner{background:linear-gradient(135deg,var(--pink-soft),var(--accent-soft));border:2px solid var(--pink);border-radius:var(--r);padding:16px;text-align:center}
.reward{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.claim-btn{min-height:40px;border-radius:12px;padding:4px 14px;font-weight:700;background:var(--accent);color:#fff}.claim-btn:disabled{background:var(--line);color:var(--muted)}
.note{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.pill{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800}.pill.p{background:var(--pos-soft);color:var(--pos)}.pill.n{background:var(--neg-soft);color:var(--neg)}
.parent-task{padding:12px 14px;border:2px dashed var(--pink);border-radius:16px;background:var(--pink-soft)}
.modal-backdrop{position:fixed;inset:0;background:rgba(45,27,78,.5);display:grid;place-items:center;z-index:100;padding:20px}
.modal{background:var(--surface);border-radius:24px;padding:24px 20px;width:min(340px,100%);display:grid;gap:14px;text-align:center}
.pin-row{display:flex;gap:8px;justify-content:center}.pin-row input{width:50px;height:54px;text-align:center;font-size:24px;font-weight:800;border:2px solid var(--line);border-radius:14px;background:var(--bg)}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--accent-deep),var(--pink));color:#fff;padding:14px 22px;border-radius:99px;font-weight:700;font-size:14px;z-index:200;max-width:90%;text-align:center}
.celeb{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden}.celeb span{position:absolute;font-size:22px;animation:fall 1.8s ease-out forwards;opacity:0}
@keyframes fall{0%{opacity:1;transform:translateY(-20px)}100%{opacity:0;transform:translateY(100vh)}}
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;background:#aaa}.sync-dot.on{background:#2E9E6A}.sync-dot.off{background:#E86A4A}
.foot{display:grid;gap:10px}.foot-actions{display:flex;justify-content:center}.rule{font-size:12px;color:var(--muted);text-align:center}
.datebar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:1.5px solid var(--line);background:var(--surface)}
.badge{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 10px;border-radius:99px}
.type{display:grid;grid-template-columns:1fr 1fr;gap:6px}.type button{min-height:42px;border-radius:14px;border:2px solid var(--line);background:transparent;font-weight:700;color:var(--muted)}
.type .tp[aria-pressed=true]{background:var(--pos-soft);border-color:var(--pos);color:var(--pos)}.type .tn[aria-pressed=true]{background:var(--neg-soft);border-color:var(--neg);color:var(--neg)}
.empty-fun{text-align:center;padding:20px}.empty-fun .big{font-size:40px}
.chart-wrap{display:flex;align-items:flex-end;gap:3px;height:140px;overflow-x:auto}
.chart-col{flex:1;min-width:14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.chart-bar{width:100%;max-width:22px;border-radius:6px 6px 3px 3px;min-height:3px}
.chart-lbl{font-size:9px;color:var(--muted)}
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.theme-btn{border:2px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center;background:var(--surface);font-weight:700}
.theme-btn.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.theme-btn .t-icon{font-size:28px;display:block}
.range-btns{display:flex;gap:6px;flex-wrap:wrap}.range-btns button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;font-size:12.5px;font-weight:700}
.range-btns button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.health-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.health-chip{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 12px;border-radius:16px;background:var(--accent-soft);border:1.5px solid var(--line);min-width:64px}
.health-chip.ok{background:var(--pos-soft);border-color:var(--pos)}
.health-chip .h-emoji{font-size:28px}.health-chip .h-days{font-size:11px;font-weight:800;color:var(--accent-deep)}
.health-item{padding:14px;border:1.5px solid var(--line);border-radius:16px;margin-top:10px}
.hi-top{display:flex;align-items:center;gap:12px}.hi-emoji{font-size:36px}.hi-countdown{text-align:center;padding:8px;background:var(--accent-soft);border-radius:12px}.hi-countdown span{font-size:28px;font-weight:800;color:var(--accent-deep);display:block}
/* Calendar */
.cal-card,.fun-cal{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px;background:linear-gradient(145deg,#F3ECFF,#FFEAF4 60%,#FFF6D6);border:2px solid #E9D5FF;border-radius:24px;padding:14px 10px;box-shadow:var(--shadow)}
.cal-nav{width:44px;height:44px;border-radius:50%;border:2px solid var(--accent);background:#fff;color:var(--accent-deep);font-size:22px;font-weight:800;box-shadow:0 2px 8px rgba(155,109,255,.15)}
.cal-nav:disabled{opacity:.35}.cal-mid{text-align:center}.cal-emoji{font-size:32px;line-height:1}
.cal-date{font-weight:800;font-size:14px;margin-top:4px}
.cal-badge{display:inline-block;background:linear-gradient(90deg,var(--accent),var(--pink));color:#fff;border-radius:99px;padding:3px 14px;font-size:11px;font-weight:800;margin-top:4px}
.cal-points{font-size:12.5px;margin-top:6px;color:var(--ink)}.cal-points b{color:var(--accent-deep)}.cal-pct{color:var(--pink);font-weight:800}
.cal-bar{height:12px;border-radius:99px;background:#fff;overflow:hidden;margin-top:6px;border:1px solid var(--line)}
.cal-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--pink),var(--gold));border-radius:99px}
/* Prizes */
.prizes-card{background:linear-gradient(180deg,#fff,#FBF7FF)}
.prize-tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.prize-box{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 8px;text-align:center}
.prize-box.day{border-color:#FFC94A}.prize-box.week{border-color:#9B6DFF}.prize-box.month{border-color:#FF8BC2}
.pb-icon{font-size:26px}.pb-label{font-size:12px;font-weight:800;color:var(--muted)}.pb-val{font-size:15px;font-weight:800;color:var(--accent-deep);margin-top:2px}
.pb-list{font-size:11px;margin-top:6px;color:var(--ink)}.pb-empty{font-size:11px;color:var(--muted);margin-top:6px}
.badge-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:4px}
.ach{background:var(--accent-soft);color:var(--accent-deep);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:800}
.chip-edit{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line);border-radius:99px;padding:4px 10px;font-size:13px;margin:3px}
.health-report-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.hr-emoji{font-size:28px}.hr-info strong{display:block}.hr-info small{color:var(--muted)}
.balloon-layer{position:fixed;inset:0;pointer-events:none;z-index:400;overflow:hidden}
.balloon{position:absolute;bottom:-80px;width:36px;height:44px;border-radius:50%;animation:rise linear forwards}
.balloon:after{content:'';position:absolute;left:50%;bottom:-12px;width:2px;height:14px;background:rgba(0,0,0,.15)}
@keyframes rise{0%{transform:translateY(0) scale(1);opacity:1}70%{opacity:1}100%{transform:translateY(-110vh) scale(1.2);opacity:0}}
</style>
</head>
<body>
<div id="app" dir="rtl"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="app.js"></script>
<script src="app2.js"></script>
<script src="role-hard.js"></script>
<script src="approve-fix.js"></script>
<script src="enhance.js"></script>
</body>
</html>
