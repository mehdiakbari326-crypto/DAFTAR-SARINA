<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9B6DFF">
<title>دفتر روزانه سارینا</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap">
<style>
:root,[data-theme="unicorn"]{--bg:#FBF7FF;--surface:#FFF;--ink:#2D1B4E;--muted:#8B7AA8;--line:#EDE4FF;--accent:#9B6DFF;--accent-soft:#F3ECFF;--accent-deep:#6B3FBF;--pos:#2E9E6A;--pos-soft:#E0F5EB;--neg:#E86A4A;--neg-soft:#FDE8E2;--pink:#FF8BC2;--pink-soft:#FFEAF4;--gold:#FFC94A;--gold-soft:#FFF6D6;--hero:linear-gradient(145deg,#A78BFA 0%,#C084FC 40%,#F472B6 100%);--font:'Vazirmatn',Tahoma,system-ui,sans-serif;--r:20px;--shadow:0 10px 28px rgba(155,109,255,.18)}
[data-theme="princess"]{--bg:#FFF5F8;--surface:#FFF;--ink:#4A1C40;--muted:#A87A96;--line:#FFE0EC;--accent:#E85A9B;--accent-soft:#FFE8F2;--accent-deep:#B83D72;--hero:linear-gradient(145deg,#E85A9B,#FF8BC2 50%,#FFB6D9)}
[data-theme="ocean"]{--bg:#F0F9FF;--surface:#FFF;--ink:#0C3B5E;--muted:#5A8AAB;--line:#D6EEFF;--accent:#3B9EFF;--accent-soft:#E5F4FF;--accent-deep:#1A6FBF;--hero:linear-gradient(145deg,#3B9EFF,#5EC8FF 50%,#7DD3FC)}
[data-theme="forest"]{--bg:#F3FBF5;--surface:#FFF;--ink:#1A3D2B;--muted:#5A8A6E;--line:#D4F0DC;--accent:#3DBF6E;--accent-soft:#E5F8EC;--accent-deep:#1E8A4A;--hero:linear-gradient(145deg,#3DBF6E,#6ED99A 50%,#A7F3C0)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.7;min-height:100dvh}button,input{font:inherit;color:inherit}button{cursor:pointer;border:0}
.shell{max-width:560px;margin:0 auto;display:grid;gap:14px;padding:14px 14px 70px}
.hero,.fun-hero{position:relative;overflow:hidden;background:var(--hero);border-radius:28px;padding:18px 14px 12px;color:#fff;box-shadow:var(--shadow)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hero-greeting{font-size:13px;opacity:.9;font-weight:600}.hero-name{font-size:26px;font-weight:800;margin:2px 0}.hero-sub{font-size:12px;opacity:.85}
.sync-dot{width:10px;height:10px;border-radius:50%;background:#ff6b6b;display:inline-block}.sync-dot.on{background:#3ddc97}.sync-dot.off{background:#ff6b6b}
.card{background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:0 4px 16px rgba(45,27,78,.06);border:1px solid var(--line)}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.card-h h2{margin:0;font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:#fff;border-radius:14px;padding:12px 16px;font-weight:700;min-height:44px}
.ghost{background:transparent;color:var(--accent-deep);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:700}
.muted{color:var(--muted);font-size:13px}
.task{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:var(--accent-soft);margin-bottom:8px;border:2px solid transparent}
.task.done{background:var(--pos-soft);border-color:var(--pos)}.task.missed{background:var(--neg-soft);border-color:var(--neg)}
.task-title{flex:1;font-weight:700}.task-actions{display:flex;gap:6px}
.task-actions button{min-width:40px;min-height:40px;border-radius:12px;font-size:16px;background:#fff;border:1.5px solid var(--line)}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:50}
.nav button{background:transparent;padding:6px 2px;font-size:11px;font-weight:700;color:var(--muted);border-radius:12px}
.nav button.active{color:var(--accent-deep);background:var(--accent-soft)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;z-index:100;font-size:13px}
.level-card{background:linear-gradient(145deg,#F3ECFF,#FFEAF4);border:2px solid #E9D5FF;border-radius:24px;padding:14px}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--accent-soft);color:var(--accent-deep);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700;border:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.tabs button{flex:1;min-width:70px;padding:10px;border-radius:12px;background:var(--accent-soft);color:var(--accent-deep);font-weight:700}.tabs button.active{background:var(--accent);color:#fff}
.cal-card,.fun-cal{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px;background:linear-gradient(145deg,#F3ECFF,#FFEAF4 60%,#FFF6D6);border:2px solid #E9D5FF;border-radius:24px;padding:14px 10px}
.cal-nav{width:44px;height:44px;border-radius:50%;border:2px solid var(--accent);background:#fff;color:var(--accent-deep);font-size:22px;font-weight:800}
.cal-mid{text-align:center}.cal-date{font-weight:800;font-size:14px}.cal-badge{display:inline-block;background:linear-gradient(90deg,var(--accent),var(--pink));color:#fff;border-radius:99px;padding:3px 14px;font-size:11px;font-weight:800}
.cal-bar{height:12px;border-radius:99px;background:#fff;overflow:hidden;margin-top:6px}.cal-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--pink),var(--gold))}
.prizes-card{background:linear-gradient(180deg,#fff,#FBF7FF)}
.prize-tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.prize-box{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 8px;text-align:center}
.badge-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.ach{background:var(--accent-soft);color:var(--accent-deep);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:800}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.set-info{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.set-actions{display:flex;gap:6px;flex-shrink:0}
.set-actions .edit-btn{border:1.5px solid var(--accent);color:var(--accent-deep);background:var(--accent-soft);border-radius:10px;padding:4px 12px;font-size:12px;font-weight:700;min-height:36px}
.chart-wrap{display:flex;align-items:flex-end;gap:3px;height:160px;overflow-x:auto;padding:8px 4px 0;direction:ltr}
.chart-col{flex:1;min-width:14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.chart-bar{width:70%;max-width:22px;border-radius:8px 8px 4px 4px;min-height:4px}
.chart-lbl{font-size:9px;font-weight:700;color:var(--muted);white-space:nowrap}
</style>
</head>
<body>
<div id="app" dir="rtl"></div>

<script src="app2.js"></script>
<script src="persist-guard.js"></script>
<script src="role-hard.js"></script>

<script src="cloud-config.js"></script>
<script src="sync-fix.js"></script>
<script src="enhance.js"></script>
<script src="weight.js"></script>
<script src="settings-ui.js"></script>
<script src="health-ui.js"></script>
<script src="report-fix.js"></script>
<script src="ui-polish.js"></script>
<script src="behavior-tasks.js"></script>
<script src="sarina-play.js"></script>
</body>
</html>
