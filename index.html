/* ---------- Notifications ---------- */
async function requestNotifPermission(){
  try{
    if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications){
      const perm = await window.Capacitor.Plugins.LocalNotifications.requestPermissions();
      return perm && perm.display === 'granted';
    }
  }catch(e){console.warn('notif perm',e)}
  return false;
}
async function showEncourageNotif(title, body){
  try{
    if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications){
      await window.Capacitor.Plugins.LocalNotifications.schedule({
        notifications: [{
          id: Date.now() % 100000,
          title: title || 'آفرین سارینا 💜',
          body: body || 'یک ستاره بنفش گرفتی!',
          schedule: { at: new Date(Date.now() + 500) }
        }]
      });
    }
  }catch(e){console.warn('notif error',e)}
}
async function scheduleDailyReminders(){
  try{
    if(!(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications)) return;
    await window.Capacitor.Plugins.LocalNotifications.cancel({notifications:[{id:1001},{id:1002},{id:1003}]});
    const now = new Date();
    let m = new Date(now); m.setHours(8,0,0,0); if(m <= now) m.setDate(m.getDate()+1);
    let a = new Date(now); a.setHours(16,0,0,0); if(a <= now) a.setDate(a.getDate()+1);
    let e = new Date(now); e.setHours(20,30,0,0); if(e <= now) e.setDate(e.getDate()+1);
    await window.Capacitor.Plugins.LocalNotifications.schedule({
      notifications: [
        {id:1001, title:'صبح بخیر سارینا 🌸', body:'وقت مسواک زدن و آماده‌شدن برای روز قهرمانانه!', schedule:{at:m, repeats:true, every:'day'}},
        {id:1002, title:'یادت نره 💜', body:'تکالیف و مرتب کردن اتاق رو انجام دادی؟', schedule:{at:a, repeats:true, every:'day'}},
        {id:1003, title:'شب بخیر ستاره من ✨', body:'مسواک زدی؟ کارهای امروزت رو تیک بزن!', schedule:{at:e, repeats:true, every:'day'}}
      ]
    });
  }catch(err){console.warn('schedule error',err)}
}

app.addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(!t)return;var a=t.getAttribute('data-act'),d=t.dataset;if(a==='view'){view=d.v;render();return}if(a==='day'){curKey=addDays(curKey,+d.n);render();return}if(a==='today'){curKey=todayKey();render();return}if(a==='goto'){curKey=d.k;view='today';render();return}if(a==='range'){range=+d.n;render();return}if(a==='type'){draftType=d.t;render();return}if(a==='edit'){editing=!editing;confirmId=null;render();return}if(a==='mark'){mutDay(curKey,function(day){if(!day.tasks[d.id])day.tasks[d.id]={t:(S.tasks.find(function(x){return x.id===d.id})||{}).title||''};if(day.tasks[d.id].s===d.s)delete day.tasks[d.id].s;else day.tasks[d.id].s=d.s});if(d.s==='done'){var msg=MOTIVATE[Math.floor(Math.random()*MOTIVATE.length)];showToast(msg);showEncourageNotif('آفرین سارینا 💜',msg)}return}if(a==='del-task'){if(confirmId==='t'+d.id){S.tasks=S.tasks.filter(function(t){return t.id!==d.id});saveProfile();confirmId=null;render()}else{confirmId='t'+d.id;render()}return}if(a==='chip-task'){draftTask=d.t;var ti=document.getElementById('taskIn');if(ti)ti.value=d.t;return}if(a==='chip'){draftText=d.t;var ni=document.getElementById('noteIn');if(ni)ni.value=d.t;return}if(a==='del-note'){mutDay(curKey,function(day){day.notes=(day.notes||[]).filter(function(n){return n.id!==d.id})});return}if(a==='claim'){var rew=S.rewards.find(function(r){return r.id===d.id});if(!rew||availablePoints()<rew.c)return;S.claims=S.claims||[];S.claims.push({id:rew.id,t:rew.t,c:rew.c,k:todayKey()});saveProfile();showToast('پاداش «'+rew.t+'» دریافت شد! 🎁');render();return}if(a==='chip-rew'){draftReward=d.t;draftCost=String(d.c);render();return}if(a==='chip-parent'){draftParentTask=d.t;var pi=document.getElementById('parentIn');if(pi)pi.value=d.t;return}if(a==='done-parent'){var pt=S.parentTasks.find(function(p){return p.id===d.id});if(pt){pt.done=true;saveProfile();showToast('آفرین به والدین! ✅');render()}return}if(a==='enter-parent'){showPinModal=true;render();return}if(a==='close-pin'){showPinModal=false;render();return}if(a==='exit-parent'){isParent=false;showToast('برگشتی به حالت سارینا 👧');render();return}if(a==='change-pin'){var np=prompt('رمز جدید ۴ رقمی را وارد کنید (فقط عدد):');if(np===null)return;np=String(np).replace(/[۰-۹]/g,function(c){return String(c.charCodeAt(0)-1776)}).replace(/[٠-٩]/g,function(c){return String(c.charCodeAt(0)-1632)}).replace(/[^0-9]/g,'');if(np.length!==4){showToast('رمز باید دقیقاً ۴ رقم باشد');return}S.parentPin=np;saveProfile();showToast('رمز والدین تغییر کرد ✅');return}if(a==='check-pin'){var p1=document.getElementById('pin1'),p2=document.getElementById('pin2'),p3=document.getElementById('pin3'),p4=document.getElementById('pin4');var code=((p1&&p1.value)||'')+((p2&&p2.value)||'')+((p3&&p3.value)||'')+((p4&&p4.value)||'');code=code.replace(/[۰-۹]/g,function(c){return String(c.charCodeAt(0)-1776)}).replace(/[٠-٩]/g,function(c){return String(c.charCodeAt(0)-1632)});if(code.length<4){var errEl=document.getElementById('pinErr');if(errEl){errEl.style.display='block';errEl.textContent='هر ۴ رقم را وارد کنید'}return}if(code===String(S.parentPin||'1234')){isParent=true;showPinModal=false;showToast('خوش اومدید والدین 💜');render()}else{var errEl2=document.getElementById('pinErr');if(errEl2){errEl2.style.display='block';errEl2.textContent='رمز اشتباه است'}if(p1)p1.value='';if(p2)p2.value='';if(p3)p3.value='';if(p4)p4.value='';if(p1)p1.focus()}return}});
app.addEventListener('submit',function(e){e.preventDefault();var form=e.target;if(form.id==='taskForm'){var title=(document.getElementById('taskIn').value||'').trim();if(!title)return;S.tasks.push({id:uid(),title:title});draftTask='';saveProfile();render();return}if(form.id==='noteForm'){var txt=(document.getElementById('noteIn').value||'').trim();if(!txt)return;mutDay(curKey,function(day){day.notes=day.notes||[];day.notes.push({id:uid(),t:txt,type:draftType,ts:Date.now()})});draftText='';if(draftType==='pos')showToast(MOTIVATE[Math.floor(Math.random()*MOTIVATE.length)]);return}if(form.id==='rewardForm'){var rt=(document.getElementById('rewIn').value||'').trim();var rc=toNum(document.getElementById('costIn').value);if(!rt||!rc)return;S.rewards.push({id:uid(),t:rt,c:rc});draftReward='';draftCost='';saveProfile();render();return}if(form.id==='goalForm'){var g=toNum(document.getElementById('goalIn').value);if(g>=5){S.goal=g;saveProfile();showToast('هدف هفتگی ذخیره شد');render()}return}if(form.id==='parentForm'){var pt=(document.getElementById('parentIn').value||'').trim();if(!pt)return;if(weekScore()<(S.goal||15)){showToast('هنوز به هدف هفتگی نرسیدی 🔒');return}S.parentTasks=S.parentTasks||[];S.parentTasks.unshift({id:uid(),t:pt,k:todayKey(),done:false});draftParentTask='';saveProfile();showToast('کار برای والدین ثبت شد! 💝');render();return}});
app.addEventListener('change',function(e){if(e.target.id==='nameIn'&&isParent){S.name=e.target.value.trim()||'سارینا';saveProfile()}});
lsLoad();if(!S.tasks.length){S.tasks=[{id:uid(),title:'مسواک زدن صبح'},{id:uid(),title:'مسواک زدن شب'},{id:uid(),title:'انجام تکالیف'},{id:uid(),title:'مرتب کردن اتاق'}];lsSave()}render();
startFirebaseSync();
requestNotifPermission().then(function(ok){if(ok) scheduleDailyReminders();});
</script>
</body>
</html>
