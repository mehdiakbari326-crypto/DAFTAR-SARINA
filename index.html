<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9B6DFF">
<title>دفتر روزانه سارینا</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap">
<style>
:root,[data-theme="unicorn"]{--bg:#FBF7FF;--surface:#FFF;--ink:#2D1B4E;--muted:#8B7AA8;--line:#EDE4FF;--accent:#9B6DFF;--accent-soft:#F3ECFF;--accent-deep:#6B3FBF;--pos:#2E9E6A;--pos-soft:#E0F5EB;--neg:#E86A4A;--neg-soft:#FDE8E2;--pink:#FF8BC2;--pink-soft:#FFEAF4;--gold:#FFC94A;--gold-soft:#FFF6D6;--hero:linear-gradient(145deg,#A78BFA 0%,#C084FC 40%,#F472B6 100%);--font:'Vazirmatn',Tahoma,system-ui,sans-serif;--r:20px;--shadow:0 10px 28px rgba(155,109,255,.18)}
[data-theme="princess"]{--bg:#FFF5F8;--surface:#FFF;--ink:#4A1C40;--muted:#A87A96;--line:#FFE0EC;--accent:#E85A9B;--accent-soft:#FFE8F2;--accent-deep:#B83D72;--hero:linear-gradient(145deg,#E85A9B,#FF8BC2 50%,#FFB6D9)}
[data-theme="ocean"]{--bg:#F0F9FF;--surface:#FFF;--ink:#0C3B5E;--muted:#5A8AAB;--line:#D6EEFF;--accent:#3B9EFF;--accent-soft:#E5F4FF;--accent-deep:#1A6FBF;--hero:linear-gradient(145deg,#3B9EFF,#5EC8FF 50%,#7DD3FC)}
[data-theme="candy"]{--bg:#FFF5FB;--surface:#FFF;--ink:#5B1A4A;--muted:#B07A9A;--line:#FFD6EC;--accent:#FF6BCB;--accent-soft:#FFE3F4;--accent-deep:#C43A8F;--hero:linear-gradient(145deg,#FF6BCB,#FF9AD5 45%,#FFD36E)}
[data-theme="sunset"]{--bg:#FFF8F2;--surface:#FFF;--ink:#4A2A1A;--muted:#B08968;--line:#FFE0C2;--accent:#FF8A3D;--accent-soft:#FFE8D6;--accent-deep:#D95A12;--hero:linear-gradient(145deg,#FF8A3D,#FFB347 40%,#FF6B8A)}
[data-theme="lavender"]{--bg:#F8F5FF;--surface:#FFF;--ink:#3B2A5C;--muted:#8E7AAD;--line:#E6DCFF;--accent:#8B5CF6;--accent-soft:#EDE6FF;--accent-deep:#6D28D9;--hero:linear-gradient(145deg,#8B5CF6,#A78BFA 40%,#C4B5FD)}
[data-theme="mint"]{--bg:#F3FFFB;--surface:#FFF;--ink:#134E4A;--muted:#5F8F88;--line:#CFFAEC;--accent:#14B8A6;--accent-soft:#D1FAF5;--accent-deep:#0F766E;--hero:linear-gradient(145deg,#14B8A6,#5EEAD4 40%,#99F6E4)}
[data-theme="rainbow"]{--bg:#FFF9FF;--surface:#FFF;--ink:#3B2060;--muted:#9B7AB8;--line:#F0E0FF;--accent:#A855F7;--accent-soft:#F3E8FF;--accent-deep:#7E22CE;--hero:linear-gradient(135deg,#F472B6,#A78BFA 35%,#38BDF8 70%,#4ADE80)}
[data-theme="forest"]{--bg:#F3FBF5;--surface:#FFF;--ink:#1A3D2B;--muted:#5A8A6E;--line:#D4F0DC;--accent:#3DBF6E;--accent-soft:#E5F8EC;--accent-deep:#1E8A4A;--hero:linear-gradient(145deg,#3DBF6E,#6ED99A 50%,#A7F3C0)}
[data-theme="sky"]{--bg:#F0F7FF;--surface:#FFF;--ink:#1E3A5F;--muted:#6B8AAD;--line:#D6E8FF;--accent:#38BDF8;--accent-soft:#E0F2FE;--accent-deep:#0284C7;--hero:linear-gradient(145deg,#38BDF8,#7DD3FC 40%,#BAE6FD)}
[data-theme="peach"]{--bg:#FFF5F0;--surface:#FFF;--ink:#5C2C1E;--muted:#B07A68;--line:#FFE0D4;--accent:#FB7185;--accent-soft:#FFE4E6;--accent-deep:#E11D48;--hero:linear-gradient(145deg,#FB7185,#FDA4AF 40%,#FECACA)}
[data-theme="berry"]{--bg:#FDF4FF;--surface:#FFF;--ink:#4A1D5C;--muted:#9B7AB0;--line:#F0D4FF;--accent:#C026D3;--accent-soft:#FAE8FF;--accent-deep:#A21CAF;--hero:linear-gradient(145deg,#C026D3,#E879F9 40%,#F0ABFC)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.7;min-height:100%;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.shell{max-width:560px;margin:0 auto;padding:12px 14px 88px;display:grid;gap:14px}
.hero{position:relative;overflow:hidden;background:var(--hero);border-radius:28px;padding:20px 16px 16px;color:#fff;box-shadow:var(--shadow)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sync-dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:#ff6b6b}
.sync-dot.on{background:#3ddc97}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:0 4px 16px rgba(45,27,78,.06)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.card-h h2{margin:0;font-size:16px;font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:#fff;border-radius:14px;padding:12px 16px;font-weight:700;min-height:44px}
.ghost{border:1.5px solid var(--line);color:var(--accent-deep);border-radius:14px;padding:10px 14px;font-weight:700;background:transparent}
.muted{color:var(--muted);font-size:13px}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:50}
.nav button{background:transparent;padding:8px 2px;font-size:11px;font-weight:700;color:var(--muted);border-radius:12px}
.nav button.active{color:var(--accent-deep);background:var(--accent-soft)}
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;z-index:200;font-size:13px;max-width:90%}
.level-card{background:linear-gradient(145deg,#F3ECFF,#FFEAF4);border:2px solid #E9D5FF;border-radius:24px;padding:14px}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;box-sizing:border-box}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{background:var(--accent-soft);color:var(--accent-deep);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700}
.cal-card{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px;background:linear-gradient(145deg,#F3ECFF,#FFEAF4 60%,#FFF6D6);border:2px solid #E9D5FF;border-radius:24px;padding:14px 10px}
.cal-nav{width:44px;height:44px;border-radius:50%;border:2px solid var(--accent);background:#fff;color:var(--accent-deep);font-size:22px;font-weight:800}
.cal-mid{text-align:center}.cal-date{font-weight:800;font-size:14px}
.cal-badge{display:inline-block;background:linear-gradient(90deg,var(--accent),var(--pink));color:#fff;border-radius:99px;padding:3px 14px;font-size:11px;font-weight:800}
.cal-bar{height:12px;border-radius:99px;background:#fff;overflow:hidden;margin-top:6px}.cal-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--pink),var(--gold))}
.modal-backdrop{position:fixed;inset:0;background:rgba(45,27,78,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9999}
.modal{background:#fff;border-radius:24px;padding:20px;width:100%;max-width:360px;box-shadow:var(--shadow)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div id="app" dir="rtl"></div>
<script src="app.js"></script>
<script src="app2.js"></script>
<script src="persist-guard.js"></script>
<script src="role-hard.js"></script>
<script src="approve-fix.js"></script>
<script src="cloud-config.js"></script>
<script src="sync-fix.js"></script>
<script src="reset-fix-v32.js"></script>
<script src="enhance.js"></script>
<script src="weight.js"></script>
<script src="settings-ui.js"></script>
<script src="health-ui.js"></script>

<script src="ui-polish.js"></script>
<script src="display-fix.js"></script>
<script src="cheer-gate.js"></script>
<script src="features-v27.js"></script>
<script src="patch-v271.js"></script>
<script src="behavior-tasks.js"></script>
<script src="sarina-play.js"></script>
<script src="fix-v28.js"></script>

</body>
</html>
