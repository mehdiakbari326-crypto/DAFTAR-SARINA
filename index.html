<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>:root{color-scheme:light}html,body{margin:0}</style>
<title>دفتر روزانه</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
<style>
/* Layout: one narrow column, phone first. Header with the child's name, two tabs (daily log / report),
   then cards for tasks and behaviours. Green = positive, burnt orange = negative, indigo = interface. */
:root {
  --bg: #F3F5F7;
  --surface: #FFFFFF;
  --ink: #17212C;
  --muted: #5B6B7B;
  --line: #DCE3EA;
  --accent: #3347C2;
  --accent-soft: #E7EBFB;
  --pos: #0F7A57;
  --pos-soft: #DDF3EA;
  --on-solid: #FFFFFF;
  --neg: #B8420F;
  --neg-soft: #FCE7DB;
  --font: 'Vazirmatn', Tahoma, system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1620; --surface: #172130; --ink: #E8EDF2; --muted: #9DABB9; --line: #283647;
    --accent: #93A4FF; --accent-soft: #212C52; --pos: #4FCBA2; --pos-soft: #12342B;
    --on-solid: #07241B; --neg: #FF9D6E; --neg-soft: #3B2418; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1620; --surface: #172130; --ink: #E8EDF2; --muted: #9DABB9; --line: #283647;
  --accent: #93A4FF; --accent-soft: #212C52; --pos: #4FCBA2; --pos-soft: #12342B;
  --on-solid: #07241B; --neg: #FF9D6E; --neg-soft: #3B2418; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.7; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.shell { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.shell.is-loading main { opacity: .45; pointer-events: none; }

.title { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; font-size: 22px; font-weight: 800; }
.name { font-weight: 800; font-size: 22px; width: min(11em, 100%); background: transparent; border: 0;
  border-bottom: 2px dashed var(--line); padding: 0 2px; border-radius: 0; }
.name::placeholder { color: var(--muted); font-weight: 500; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; margin-top: 12px;
  background: var(--accent-soft); border-radius: 12px; }
.tabs button { border: 0; background: transparent; padding: 8px; border-radius: 9px; font-weight: 700; color: var(--muted); min-height: 44px; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

main { display: grid; gap: 14px; min-width: 0; transition: opacity .2s; }
.datebar { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; }
.icon { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%;
  border: 1px solid var(--line); background: var(--surface); }
.icon:disabled { opacity: .35; cursor: default; }
.icon svg { width: 20px; height: 20px; }
.dt { text-align: center; display: grid; justify-items: center; line-height: 1.5; }
.dt strong { font-size: 16px; }
.badge { font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 0 10px; border-radius: 99px; }
.link { background: none; border: 0; color: var(--accent); font-size: 13px; font-weight: 700; padding: 2px 8px; text-decoration: underline; text-underline-offset: 3px; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; }
.stats.c3 { grid-template-columns: repeat(3, 1fr); }
.stats .s b { color: var(--accent); }
.stats > div { padding: 2px 6px; display: grid; }
.stats > div + div { border-inline-start: 1px solid var(--line); }
.stats .lab { font-size: 12.5px; color: var(--muted); }
.stats b { font-size: 26px; line-height: 1.3; font-variant-numeric: tabular-nums; }
.stats b small { font-size: 13px; font-weight: 500; color: var(--muted); }
.stats .p b { color: var(--pos); }
.stats .n b { color: var(--neg); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card-h h2 { margin: 0; font-size: 17px; font-weight: 800; }
.ghost { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: transparent;
  border-radius: 99px; padding: 4px 12px; font-size: 13px; font-weight: 500; min-height: 36px; }
.ghost[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.ghost svg { width: 15px; height: 15px; }
.muted { color: var(--muted); font-size: 13.5px; margin: 0; }

ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.task { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; }
.task.s-done { border-color: var(--pos); background: var(--pos-soft); }
.task.s-missed { border-color: var(--neg); background: var(--neg-soft); }
.task-t { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 700; }
.task-t span { min-width: 0; overflow-wrap: anywhere; }
.task-t em { font-style: normal; font-weight: 500; font-size: 12px; color: var(--muted); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px; font-weight: 700; }
.seg svg { width: 18px; height: 18px; }
.seg .ok[aria-pressed="true"] { background: var(--pos); border-color: var(--pos); color: var(--on-solid); }
.seg .no[aria-pressed="true"] { background: var(--neg); border-color: var(--neg); color: var(--on-solid); }
.seg .ok:not([aria-pressed="true"]) { color: var(--pos); }
.seg .no:not([aria-pressed="true"]) { color: var(--neg); }
.del { border: 1px solid var(--neg); color: var(--neg); background: transparent; border-radius: 8px; padding: 2px 10px; font-size: 13px; min-height: 36px; white-space: nowrap; }
.del.sure { background: var(--neg); color: var(--on-solid); }

form.add { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.inp { min-width: 0; min-height: 46px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; background: var(--bg); }
.inp::placeholder { color: var(--muted); }
.btn { min-height: 46px; border: 0; border-radius: 10px; padding: 6px 18px; font-weight: 700; background: var(--accent); color: var(--surface); }
.type { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.type button { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: transparent; font-weight: 700; color: var(--muted); }
.type .tp[aria-pressed="true"] { background: var(--pos-soft); border-color: var(--pos); color: var(--pos); }
.type .tn[aria-pressed="true"] { background: var(--neg-soft); border-color: var(--neg); color: var(--neg); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px dashed var(--line); background: transparent; border-radius: 99px; padding: 2px 12px; font-size: 13.5px; min-height: 36px; }
.chip:hover { border-style: solid; }

.note { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.note:first-child { border-top: 0; }
.pill { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 18px; line-height: 1; }
.pill.p { background: var(--pos-soft); color: var(--pos); }
.pill.n { background: var(--neg-soft); color: var(--neg); }
.note-t { min-width: 0; overflow-wrap: anywhere; }
.note-t small { display: block; color: var(--muted); font-size: 12px; line-height: 1.3; }
.notes { display: grid; }

.range { display: flex; gap: 6px; }
.chart { display: flex; gap: 3px; direction: rtl; padding-top: 4px; }
.col { flex: 1; min-width: 0; padding: 0; border: 0; background: transparent; display: grid; grid-template-rows: 56px 56px auto; }
.up, .down { display: flex; }
.up { align-items: flex-end; }
.down { align-items: flex-start; border-top: 1px solid var(--muted); }
.up i, .down i { display: block; width: 100%; border-radius: 3px; }
.up i { background: var(--pos); }
.down i { background: var(--neg); }
.col .lbl { font-size: 10.5px; text-align: center; color: var(--muted); height: 18px; line-height: 18px; white-space: nowrap; overflow: visible; }
.col.today .lbl { color: var(--accent); font-weight: 800; }
.legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 6px; vertical-align: -1px; }
.legend .lp::before { background: var(--pos); }
.legend .ln::before { background: var(--neg); }
.rate { display: grid; gap: 4px; }
.rate-h { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--pos); border-radius: 99px; }
.top-l { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-top: 1px solid var(--line); }
.top-l:first-of-type { border-top: 0; }
.top-l b { font-variant-numeric: tabular-nums; }
.cols2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.cols2 h3 { margin: 0 0 4px; font-size: 14px; }
.dayrow { display: grid; grid-template-columns: 1fr auto auto auto; gap: 14px; align-items: center; width: 100%; text-align: start;
  padding: 10px 0; background: transparent; border: 0; border-top: 1px solid var(--line); min-height: 48px; }
.dayrow:first-child { border-top: 0; }
.dayrow .t { color: var(--muted); font-size: 13px; }
.dayrow .p { color: var(--pos); font-weight: 700; }
.dayrow .n { color: var(--neg); font-weight: 700; }
.status { font-size: 13px; color: var(--muted); text-align: center; margin: 0; }
.status.err { color: var(--neg); font-weight: 700; }
.empty { text-align: center; padding: 8px 0; }
.week { display: grid; gap: 8px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.week .rate-h b { color: var(--accent); }
.goal-done { color: var(--pos); font-weight: 700; }
.reward { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.reward:first-child { border-top: 0; }
.reward .r-t { min-width: 0; overflow-wrap: anywhere; font-weight: 700; }
.reward .r-t small { display: block; font-weight: 500; color: var(--muted); font-size: 12.5px; line-height: 1.4; }
.claim-btn { min-height: 44px; border: 0; border-radius: 10px; padding: 4px 16px; font-weight: 700; background: var(--accent); color: var(--surface); }
.claim-btn:disabled { background: var(--line); color: var(--muted); cursor: default; }
form.add3 { display: grid; grid-template-columns: 1fr 84px auto; gap: 8px; }
.ta { width: 100%; direction: ltr; text-align: left; font-family: ui-monospace, Consolas, monospace; font-size: 12px; line-height: 1.5; resize: vertical; overflow-wrap: anywhere; }
a.btn { display: grid; place-items: center; text-decoration: none; }
.btn.alt { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.rule { font-size: 13px; color: var(--muted); margin: 0; }
@media (prefers-reduced-motion: reduce) { main { transition: none; } }
</style>

</head>
<body>
<div id="app" dir="rtl"></div>

<script>
document.documentElement.setAttribute('dir', 'rtl');
document.documentElement.setAttribute('lang', 'fa');

/* ---------- helpers ---------- */
var PRESET_TASKS = ['مسواک زدن صبح', 'مسواک زدن شب', 'انجام تکالیف مدرسه', 'مرتب کردن اتاق', 'جمع کردن تخت', 'کتاب خواندن ۲۰ دقیقه', 'آماده کردن کیف مدرسه'];
var PRESET_POS = ['کمک در کارهای خانه', 'مهربانی با دیگران', 'راستگویی', 'ادب و تشکر', 'تلاش و پشتکار', 'عذرخواهی کردن'];
var PRESET_NEG = ['دروغ گفتن', 'بی‌احترامی', 'لجبازی', 'دعوا کردن', 'حرف گوش نکردن', 'داد زدن'];

function pad(n) { return String(n).padStart(2, '0'); }
function keyOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function fromKey(k) { var p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2], 12); }
function addDays(k, n) { var d = fromKey(k); d.setDate(d.getDate() + n); return keyOf(d); }
function todayKey() { return keyOf(new Date()); }
function fa(n) { return Number(n).toLocaleString('fa-IR'); }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function mkFmt(opts) {
  try { return new Intl.DateTimeFormat('fa-IR-u-ca-persian', opts); } catch (e) { return new Intl.DateTimeFormat('fa-IR', opts); }
}
var fmtFull = mkFmt({ weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
var fmtShort = mkFmt({ weekday: 'short', day: 'numeric', month: 'long' });
var fmtDay = mkFmt({ day: 'numeric' });
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

var ICON = {
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  no: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>'
};

/* ---------- state ---------- */
var S = { name: '', tasks: [], days: {}, rewards: [], claims: [], goal: 0, tomb: {}, pu: 0 };
var syncCode = '', syncMsg = '', pasteDraft = '';
var draftReward = '', draftCost = '', draftGoal = null;
var PRESET_REWARDS = [{ t: 'انتخاب فیلم شب', c: 6 }, { t: 'بستنی', c: 8 }, { t: 'یک ساعت بازی', c: 10 }, { t: 'گردش آخر هفته', c: 25 }];
function toNum(s) {
  var m = String(s || '').replace(/[۰-۹]/g, function (c) { return c.charCodeAt(0) - 1776; }).replace(/[٠-٩]/g, function (c) { return c.charCodeAt(0) - 1632; });
  var n = parseInt(m, 10); return isNaN(n) ? 0 : Math.max(0, Math.min(9999, n));
}
var view = 'today', curKey = todayKey(), range = 7;
var draftType = 'pos', draftText = '', draftTask = '';
var editing = false, confirmId = null, errMsg = '', loadNote = '';
var mode = 'pending';      // pending | db | local
var ready = false;
var dbc = null;
var app = document.getElementById('app');

/* ---------- storage ---------- */
var LS = 'daftar-roozane-v1';
function lsLoad() {
  try { var j = JSON.parse(localStorage.getItem(LS)); if (j) { S.name = j.name || ''; S.tasks = j.tasks || []; S.days = j.days || {}; S.rewards = j.rewards || []; S.claims = j.claims || []; S.goal = j.goal || 0; S.tomb = j.tomb || {}; S.pu = j.pu || 0; } } catch (e) {}
}
function lsSave() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }

var queue = {};
function save(id, data) {
  if (mode !== 'db') { lsSave(); return; }
  var q = queue[id] || (queue[id] = { busy: false, next: null });
  q.next = data;
  pump(id);
}
async function pump(id) {
  var q = queue[id];
  if (q.busy) return;
  q.busy = true;
  while (q.next) {
    var d = q.next; q.next = null;
    try { await dbc.doc('tracker/' + id).set(d); errMsg = ''; }
    catch (e) {
      errMsg = (e && e.code === 'invalid_argument') ? 'ذخیره نشد: این حساب اجازهٔ نوشتن ندارد.' :
        (e && e.code === 'quota_exceeded') ? 'ذخیره نشد: فضای ذخیره‌سازی پر شده است.' : 'ذخیره نشد. اتصال را بررسی کنید و دوباره تلاش کنید.';
      render();
    }
  }
  q.busy = false;
}
function isBusy(id) { var q = queue[id]; return !!(q && (q.busy || q.next)); }

function saveProfile(bump) {
  if (bump) S.pu = Date.now();
  save('profile', { k: 'zzzz', name: S.name, tasks: S.tasks, rewards: S.rewards, claims: S.claims, goal: S.goal, tomb: S.tomb, pu: S.pu });
}
function getDay(k) { return S.days[k] || { tasks: {}, notes: [] }; }
function mutDay(k, fn) {
  var d = JSON.parse(JSON.stringify(getDay(k)));
  d.tasks = d.tasks || {}; d.notes = d.notes || [];
  fn(d);
  d.k = k;
  S.days[k] = d;
  save('d-' + k, d);
  render();
}

var snapTimer = null;
function onSnap(snap) {
  snap.docs.forEach(function (doc) {
    var id = doc.id; if (isBusy(id)) return;
    var v = doc.data(); if (!v) return;
    if (id === 'profile') {
      var ae = document.activeElement;
      if (!(ae && ae.id === 'nameIn')) S.name = v.name || '';
      S.tasks = v.tasks || []; S.rewards = v.rewards || []; S.claims = v.claims || []; S.goal = v.goal || 0; S.tomb = v.tomb || {}; S.pu = v.pu || 0;
    } else if (id.indexOf('d-') === 0) {
      S.days[id.slice(2)] = { tasks: v.tasks || {}, notes: v.notes || [] };
    }
  });
  if (!snap.metadata.fromCache) { ready = true; loadNote = ''; clearTimeout(snapTimer); }
  render();
}

/* ---------- derived ---------- */
function dayTaskList(k) {
  var rec = getDay(k).tasks || {};
  var list = S.tasks.map(function (t) { return { id: t.id, title: t.title, s: rec[t.id] && rec[t.id].s, live: true }; });
  Object.keys(rec).forEach(function (id) {
    if (rec[id].s && !S.tasks.some(function (t) { return t.id === id; })) list.push({ id: id, title: rec[id].t, s: rec[id].s, live: false });
  });
  return list;
}
function dayStats(k) {
  var d = S.days[k]; var r = { done: 0, missed: 0, pos: 0, neg: 0 };
  if (!d) return r;
  Object.keys(d.tasks || {}).forEach(function (id) { var s = d.tasks[id].s; if (s === 'done') r.done++; else if (s === 'missed') r.missed++; });
  (d.notes || []).forEach(function (n) { if (n.type === 'pos') r.pos++; else r.neg++; });
  return r;
}
function chipsFor(type) {
  var count = {};
  var from = addDays(todayKey(), -60);
  Object.keys(S.days).forEach(function (k) {
    if (k < from) return;
    (S.days[k].notes || []).forEach(function (n) { if (n.type === type) count[n.text] = (count[n.text] || 0) + 1; });
  });
  var recent = Object.keys(count).sort(function (a, b) { return count[b] - count[a]; });
  var presets = type === 'pos' ? PRESET_POS : PRESET_NEG;
  var out = recent.slice(0, 6);
  presets.forEach(function (p) { if (out.length < 6 && out.indexOf(p) < 0) out.push(p); });
  return out;
}

/* ---------- views ---------- */
function header() {
  return '<header><div class="title"><span>دفتر روزانهٔ</span>' +
    '<input id="nameIn" class="name" type="text" value="' + esc(S.name) + '" placeholder="نام دخترم" maxlength="30" autocomplete="off" aria-label="نام کودک"></div>' +
    '<div class="tabs" role="tablist">' +
    '<button role="tab" aria-selected="' + (view === 'today') + '" data-act="view" data-v="today">ثبت روز</button>' +
    '<button role="tab" aria-selected="' + (view === 'report') + '" data-act="view" data-v="report">گزارش</button>' +
    '<button role="tab" aria-selected="' + (view === 'rewards') + '" data-act="view" data-v="rewards">پاداش</button></div></header>';
}

function todayView() {
  var k = curKey, isToday = k === todayKey();
  var list = dayTaskList(k), d = getDay(k);
  var done = list.filter(function (t) { return t.s === 'done'; }).length;
  var pos = d.notes.filter(function (n) { return n.type === 'pos'; }).length;
  var neg = d.notes.length - pos;
  var h = '';

  h += '<div class="datebar"><button class="icon" data-act="day" data-n="-1" aria-label="روز قبل">' + ICON.right + '</button>' +
    '<div class="dt"><strong>' + fmtFull.format(fromKey(k)) + '</strong>' +
    (isToday ? '<span class="badge">امروز</span>' : '<button class="link" data-act="today">بازگشت به امروز</button>') + '</div>' +

function reportView() {

      return '<button class="col' + (s.k === t ? ' today' : '') + '" data-act="goto" data-k="' + s.k + '" title="' + fmtShort.format(fromKey(s.k)) + ' — مثبت: ' + fa(s.pos) + '، منفی: ' + fa(s.neg) + '">' +
        '<span class="up"><i style="height:' + up + 'px"></i></span><span class="down"><i style="height:' + dn + 'px"></i></span>' +
        '<span class="lbl">' + (show ? fmtDay.format(fromKey(s.k)) : '') + '</span></button>';

  /* per-task rates */
  if (S.tasks.length) {
    h += '<section class="card"><div class="card-h"><h2>انجام هر تسک</h2></div>' + S.tasks.map(function (tk) {
      var dn = 0, ms = 0;
      keys.forEach(function (k) { var r = (S.days[k] && S.days[k].tasks || {})[tk.id]; if (r) { if (r.s === 'done') dn++; else if (r.s === 'missed') ms++; } });

/* ---------- points, goal, rewards ---------- */
function score(s) { return s.done + s.pos - s.neg; }
function fmtSigned(n) { return (n > 0 ? '+' : n < 0 ? '−' : '') + fa(Math.abs(n)); }
function totalScore() { var t = 0; Object.keys(S.days).forEach(function (k) { t += score(dayStats(k)); }); return t; }
function spentTotal() { return S.claims.reduce(function (a, c) { return a + c.cost; }, 0); }
function weekKeys() {
  var t = todayKey(), off = (fromKey(t).getDay() + 1) % 7, s = addDays(t, -off), a = [];
  for (var i = 0; i < 7; i++) a.push(addDays(s, i));
  return a;
}
function weekScore() { return weekKeys().reduce(function (a, k) { return a + score(dayStats(k)); }, 0); }
function goalBar() {
  var ws = weekScore(), g = S.goal || 0;
  var h = '<div class="rate-h"><span>امتیاز این هفته</span><b>' + (g ? fmtSigned(ws) + ' از ' + fa(g) : fmtSigned(ws)) + '</b></div>';

    var p = Math.max(0, Math.min(100, Math.round(ws / g * 100)));
    h += '<div class="bar" role="img" aria-label="' + fa(p) + ' درصد هدف هفتگی"><i style="width:' + p + '%"></i></div>';
    if (ws >= g) h += '<p class="goal-done">هدف این هفته کامل شد.</p>';
  }
  return h;
}
function weekBox() {
  var bal = totalScore() - spentTotal();
  return '<section class="week">' + goalBar() +
    (S.goal ? '' : '<p class="muted">هدف هفتگی هنوز تعیین نشده. از تب «پاداش» تعیینش کنید.</p>') +
    '<p class="muted">موجودی امتیاز برای پاداش: <b>' + fmtSigned(bal) + '</b></p></section>';
}
function rewardsView() {

  var h = '<section class="stats c3" aria-label="موجودی امتیاز">' +

    esc(draftGoal !== null ? draftGoal : (S.goal ? fa(S.goal).replace(/٬/g, '') : '')) + '" aria-label="هدف هفتگی"><button class="btn" type="submit">ذخیره</button></form>' +
    '<p class="rule">هفته از شنبه شروع می‌شود. برای حذف هدف، خالی ذخیره کنید.</p></section>';

    }).join('') + '</div>';

    }).join('') + '</div></section>';
  }
  return h;

/* ---------- manual sync (copy a code, send it, paste it on the other phone) ---------- */
async function encodeData() {
  var from = addDays(todayKey(), -90), days = {};
  Object.keys(S.days).forEach(function (k) { if (k >= from) days[k] = S.days[k]; });
  var obj = { v: 1, name: S.name, tasks: S.tasks, rewards: S.rewards, claims: S.claims, goal: S.goal, tomb: S.tomb, pu: S.pu, days: days };
  var bytes = new TextEncoder().encode(JSON.stringify(obj)), prefix = 'DAFTAR1:';
  if (window.CompressionStream) {
    try { bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer()); prefix = 'DAFTAR2:'; } catch (e) {}
  }
  var bin = '';
  for (var i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return prefix + btoa(bin);
}
async function decodeData(text) {
  var m = /DAFTAR([12]):([A-Za-z0-9+\/=]+)/.exec(String(text || '').replace(/\s+/g, ''));
  if (!m) throw new Error('bad');
  var bin = atob(m[2]), bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  if (m[1] === '2') bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
  var obj = JSON.parse(new TextDecoder().decode(bytes));
  if (!obj || obj.v !== 1) throw new Error('bad');
  return obj;
}
function mergeIn(r) {
  var tomb = {}, k;
  for (k in (S.tomb || {})) tomb[k] = S.tomb[k];
  for (k in (r.tomb || {})) tomb[k] = r.tomb[k];
  function union(a, b) {
    var m = {}, order = [];
    (a || []).concat(b || []).forEach(function (x) { if (x && x.id && !tomb[x.id] && !m[x.id]) { m[x.id] = x; order.push(x.id); } });
    return order.map(function (id) { return m[id]; });
  }
  S.tasks = union(S.tasks, r.tasks); S.rewards = union(S.rewards, r.rewards); S.claims = union(S.claims, r.claims);
  if ((r.pu || 0) > (S.pu || 0)) { S.name = r.name || S.name; S.goal = r.goal || 0; S.pu = r.pu; }
  S.tomb = tomb;
  var changed = 0, keys = {};
  Object.keys(S.days).forEach(function (x) { keys[x] = 1; });
  Object.keys(r.days || {}).forEach(function (x) { keys[x] = 1; });
  Object.keys(keys).forEach(function (day) {
    var a = getDay(day), b = (r.days || {})[day] || { tasks: {}, notes: [] };
    var out = { k: day, tasks: {}, notes: [] }, id;
    for (id in (a.tasks || {})) out.tasks[id] = a.tasks[id];
    for (id in (b.tasks || {})) { var x = b.tasks[id], y = out.tasks[id]; if (!y || (x.u || 0) > (y.u || 0)) out.tasks[id] = x; }
    out.notes = union(a.notes, b.notes).sort(function (p, q) { return (p.at || 0) - (q.at || 0); });
    var before = JSON.stringify({ t: a.tasks || {}, n: a.notes || [] });
    if (before !== JSON.stringify({ t: out.tasks, n: out.notes })) { S.days[day] = out; save('d-' + day, out); changed++; }
  });
  saveProfile();
  return changed;
}

function render() {

  app.innerHTML = html();
  if (id) { var el = document.getElementById(id); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} } }
  app.style.minHeight = '';
}

/* ---------- events ---------- */
function armConfirm(id) {
  confirmId = id;
  setTimeout(function () { if (confirmId === id) { confirmId = null; render(); } }, 3000);
}
app.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  var a = b.dataset.act, d = b.dataset;
  if (a === 'view') { view = d.v; }
  else if (a === 'day') { var nk = addDays(curKey, Number(d.n)); if (nk <= todayKey()) curKey = nk; }
  else if (a === 'today') { curKey = todayKey(); }
  else if (a === 'goto') { curKey = d.k; view = 'today'; window.scrollTo(0, 0); }
  else if (a === 'range') { range = Number(d.n); }
  else if (a === 'edit') { editing = !editing; confirmId = null; }
  else if (a === 'type') { draftType = d.t; }
  else if (a === 'mark') {
    var task = dayTaskList(curKey).filter(function (t) { return t.id === d.id; })[0]; if (!task) return;
    mutDay(curKey, function (day) { var cur = day.tasks[d.id] && day.tasks[d.id].s; day.tasks[d.id] = { t: task.title, s: cur === d.s ? '' : d.s, u: Date.now() }; });
    return;
  }
  else if (a === 'chip') { addNote(draftType, d.t); return; }
  else if (a === 'chip-task') { addTask(d.t); return; }
  else if (a === 'chip-reward') { addReward(d.t, Number(d.c)); }
  else if (a === 'sync-make') {
    syncMsg = 'در حال ساخت کد…'; render();
    encodeData().then(function (c) { syncCode = c; syncMsg = 'کد ساخته شد. آن را کپی کنید یا در واتساپ بفرستید.'; render(); })
      .catch(function () { syncMsg = 'ساخت کد ممکن نشد.'; render(); });
    return;
  }
  else if (a === 'sync-copy') {
    var done = function (ok) { syncMsg = ok ? 'کپی شد.' : 'کپی خودکار ممکن نشد. متن داخل کادر را انتخاب و کپی کنید.'; render(); };
    try { navigator.clipboard.writeText(syncCode).then(function () { done(true); }, function () { done(false); }); } catch (e) { done(false); }
    return;
  }
  else if (a === 'sync-merge') {
    decodeData(pasteDraft).then(function (obj) {
      var n = mergeIn(obj); pasteDraft = '';
      syncMsg = n ? 'ادغام شد. ' + fa(n) + ' روز به‌روز شد.' : 'ادغام شد. چیز تازه‌ای نبود.'; render();
    }).catch(function () { syncMsg = 'کد معتبر نیست. کد کامل را با DAFTAR شروع تا آخر بچسبانید.'; render(); });
    return;
  }
  else if (a === 'claim') {
    var rw = S.rewards.filter(function (r) { return r.id === d.id; })[0];
    if (rw && totalScore() - spentTotal() >= rw.cost) { S.claims = S.claims.concat([{ id: uid(), title: rw.title, cost: rw.cost, k: todayKey() }]); saveProfile(); }
  }
  else if (a === 'del-reward') {
    if (confirmId !== 'r' + d.id) armConfirm('r' + d.id);
    else { confirmId = null; S.tomb[d.id] = Date.now(); S.rewards = S.rewards.filter(function (r) { return r.id !== d.id; }); saveProfile(); }
  }
  else if (a === 'del-claim') {
    if (confirmId !== 'c' + d.id) armConfirm('c' + d.id);
    else { confirmId = null; S.tomb[d.id] = Date.now(); S.claims = S.claims.filter(function (c) { return c.id !== d.id; }); saveProfile(); }
  }
  else if (a === 'del-note') {
    if (confirmId !== 'n' + d.id) { armConfirm('n' + d.id); }
    else { confirmId = null; S.tomb[d.id] = Date.now(); saveProfile(); mutDay(curKey, function (day) { day.notes =day.notes.filter(function (n) { return n.id !== d.id; }); }); return; }
  }
  else if (a === 'del-task') {
    if (confirmId !== 't' + d.id) { armConfirm('t' + d.id); }
    else { confirmId = null; S.tomb[d.id] = Date.now(); S.tasks = S.tasks.filter(function (t) { return t.id !== d.id; }); saveProfile(); }
  }
  render();
});
app.addEventListener('input', function (e) {
  var id = e.target.id;
  if (id === 'nameIn') S.name = e.target.value;
  else if (id === 'noteIn') draftText = e.target.value;
  else if (id === 'taskIn') draftTask = e.target.value;
  else if (id === 'rewardIn') draftReward = e.target.value;
  else if (id === 'costIn') draftCost = e.target.value;
  else if (id === 'goalIn') draftGoal = e.target.value;
  else if (id === 'pasteIn') pasteDraft = e.target.value;
});
app.addEventListener('change', function (e) { if (e.target.id === 'nameIn') { S.name = e.target.value.trim(); saveProfile(true); } });
app.addEventListener('submit', function (e) {
  e.preventDefault();
  if (e.target.id === 'noteForm') addNote(draftType, draftText);
  else if (e.target.id === 'taskForm') addTask(draftTask);
  else if (e.target.id === 'rewardForm') addReward(draftReward, toNum(draftCost));
  else if (e.target.id === 'goalForm') { S.goal = toNum(draftGoal !== null ? draftGoal : S.goal); draftGoal = null; saveProfile(true); render(); }
});
function addReward(title, cost) {
  title = (title || '').trim();
  if (!title || !cost) return;
  draftReward = ''; draftCost = '';
  if (!S.rewards.some(function (r) { return r.title === title; })) { S.rewards = S.rewards.concat([{ id: 'r' + uid(), title: title, cost: cost }]); saveProfile(); }
  render();
}
function addNote(type, text) {
  text = (text || '').trim(); if (!text) return;
  draftText = '';
  mutDay(curKey, function (day) { day.notes.push({ id: uid(), type: type, text: text, at: Date.now() }); });
}
function addTask(title) {
  title = (title || '').trim(); if (!title) return;
  draftTask = '';
  if (!S.tasks.some(function (t) { return t.title === title; })) { S.tasks = S.tasks.concat([{ id: 't' + uid(), title: title }]); saveProfile(); }
  render();
}

/* ---------- start ---------- */
function goLocal() { if (mode !== 'pending') return; mode = 'local'; lsLoad(); ready = true; render(); }
render();
(async function () {
  var db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (mode !== 'pending') return;
  if (!db) { goLocal(); return; }
  mode = 'db'; dbc = db;
  snapTimer = setTimeout(function () { if (!ready) { ready = true; loadNote = 'اتصال به ذخیره‌سازی برقرار نشد. اطلاعات ثبت‌شده ممکن است قدیمی باشد.'; render(); } }, 10000);
  try {
    db.collection('tracker').orderBy('k', 'desc').limit(500).onSnapshot(onSnap, function () {
      ready = true; loadNote = 'خواندن اطلاعات ممکن نشد.'; render();
    });
  } catch (e) { ready = true; loadNote = 'خواندن اطلاعات ممکن نشد.'; render(); }
})();
setTimeout(goLocal, 12000);
</script>
