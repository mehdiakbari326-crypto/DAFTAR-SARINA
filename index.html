<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7B5EA7">
<title>دفتر روزانه سارینا</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --bg: #F8F4FC;
  --surface: #FFFFFF;
  --ink: #2D1B4E;
  --muted: #7A6B8F;
  --line: #E8DFF5;
  --accent: #7B5EA7;
  --accent-soft: #F0E6FA;
  --accent-deep: #5C3D8A;
  --pos: #2E9E6A;
  --pos-soft: #E0F5EB;
  --on-solid: #FFFFFF;
  --neg: #D45A3A;
  --neg-soft: #FDE8E2;
  --pink: #E89AB8;
  --pink-soft: #FCEAF2;
  --gold: #E8B84A;
  --font: 'Vazirmatn', Tahoma, system-ui, sans-serif;
  --r: 18px;
  --shadow: 0 4px 16px rgba(123, 94, 167, 0.10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A1228; --surface: #261B38; --ink: #F0E6FA; --muted: #B5A4C9; --line: #3A2D52;
    --accent: #B794F4; --accent-soft: #33264A; --accent-deep: #9B7AD4;
    --pos: #4FCBA2; --pos-soft: #1A3A2E; --on-solid: #0A2418;
    --neg: #FF9B7A; --neg-soft: #3D241C; --pink: #F0A8C4; --pink-soft: #3A2430;
    --gold: #F0C85A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1A1228; --surface: #261B38; --ink: #F0E6FA; --muted: #B5A4C9; --line: #3A2D52;
  --accent: #B794F4; --accent-soft: #33264A; --accent-deep: #9B7AD4;
  --pos: #4FCBA2; --pos-soft: #1A3A2E; --on-solid: #0A2418;
  --neg: #FF9B7A; --neg-soft: #3D241C; --pink: #F0A8C4; --pink-soft: #3A2430;
  --gold: #F0C85A; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.7;
  min-height: 100dvh;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.shell {
  max-width: 560px;
  margin: 0 auto;
  display: grid;
  gap: 16px;
  padding: 16px 16px 56px;
  padding-left: max(16px, env(safe-area-inset-left));
  padding-right: max(16px, env(safe-area-inset-right));
}
.shell.is-loading main { opacity: .4; pointer-events: none; }

.hero {
  background: linear-gradient(135deg, var(--accent) 0%, #9B7AD4 50%, var(--pink) 100%);
  border-radius: 24px;
  padding: 20px 18px 16px;
  color: #fff;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: "✦";
  position: absolute;
  font-size: 80px;
  opacity: .12;
  top: -10px;
  left: 10px;
  transform: rotate(-15deg);
}
.hero::after {
  content: "♡";
  position: absolute;
  font-size: 60px;
  opacity: .1;
  bottom: -8px;
  right: 20px;
}
.hero .title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 6px;
}
.hero h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.3px;
}
.hero .sub {
  font-size: 13px;
  opacity: .9;
  margin: 0 0 12px;
}
.name {
  font-weight: 800;
  font-size: 22px;
  width: min(12em, 100%);
  background: rgba(255,255,255,.2);
  border: 0;
  border-radius: 12px;
  padding: 6px 12px;
  color: #fff;
}
.name::placeholder { color: rgba(255,255,255,.65); font-weight: 500; }
.name:focus { background: rgba(255,255,255,.28); outline: 2px solid rgba(255,255,255,.5); }

.role-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: rgba(255,255,255,.22);
  border-radius: 99px;
  padding: 4px 12px;
  font-size: 12.5px;
  font-weight: 700;
}
.role-badge.parent { background: rgba(232,184,74,.35); }

.tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  padding: 4px;
  background: rgba(255,255,255,.18);
  border-radius: 14px;
}
.tabs button {
  border: 0;
  background: transparent;
  padding: 9px 4px;
  border-radius: 11px;
  font-weight: 700;
  font-size: 13px;
  color: rgba(255,255,255,.8);
  min-height: 42px;
}
.tabs button[aria-selected="true"] {
  background: #fff;
  color: var(--accent-deep);
  box-shadow: 0 2px 8px rgba(0,0,0,.12);
}

main { display: grid; gap: 14px; min-width: 0; transition: opacity .2s; }

.datebar {
  display: grid;
  grid-template-columns: 44px 1fr 44px;
  align-items: center;
  gap: 8px;
}
.icon {
  width: 44px; height: 44px;
  display: grid; place-items: center;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--surface);
  box-shadow: 0 2px 6px rgba(123,94,167,.06);
}
.icon:disabled { opacity: .35; cursor: default; }
.icon svg { width: 20px; height: 20px; }
.dt { text-align: center; display: grid; justify-items: center; line-height: 1.45; }
.dt strong { font-size: 15.5px; }
.badge {
  font-size: 12px; font-weight: 700;
  color: var(--accent); background: var(--accent-soft);
  padding: 1px 10px; border-radius: 99px; margin-top: 2px;
}
.link {
  background: none; border: 0; color: var(--accent);
  font-size: 13px; font-weight: 700; padding: 2px 8px;
  text-decoration: underline; text-underline-offset: 3px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  text-align: center;
  background: var(--surface);
  border-radius: var(--r);
  border: 1px solid var(--line);
  padding: 12px 4px;
  box-shadow: var(--shadow);
}
.stats > div { padding: 2px 4px; display: grid; gap: 2px; }
.stats > div + div { border-inline-start: 1px solid var(--line); }
.stats .lab { font-size: 11.5px; color: var(--muted); }
.stats b { font-size: 22px; line-height: 1.25; font-variant-numeric: tabular-nums; }
.stats b small { font-size: 12px; font-weight: 500; color: var(--muted); }
.stats .p b { color: var(--pos); }
.stats .n b { color: var(--neg); }
.stats .s b { color: var(--accent); }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 16px;
  display: grid;
  gap: 12px;
  min-width: 0;
  box-shadow: var(--shadow);
}
.card-h {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.card-h h2 {
  margin: 0;
  font-size: 16.5px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 6px;
}
.card-h h2 .emoji { font-size: 18px; }

.ghost {
  display: inline-flex; align-items: center; gap: 5px;
  border: 1px solid var(--line); background: transparent;
  border-radius: 99px; padding: 5px 12px;
  font-size: 12.5px; font-weight: 600; min-height: 34px;
}
.ghost[aria-pressed="true"] {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
}
.ghost svg { width: 14px; height: 14px; }
.muted { color: var(--muted); font-size: 13.5px; margin: 0; }

ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.task {
  display: grid; gap: 8px;
  padding: 12px 14px;
  border: 1.5px solid var(--line);
  border-radius: 14px;
  transition: border-color .15s, background .15s;
}
.task.s-done { border-color: var(--pos); background: var(--pos-soft); }
.task.s-missed { border-color: var(--neg); background: var(--neg-soft); }
.task-t {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-weight: 700; font-size: 14.5px;
}
.task-t span { min-width: 0; overflow-wrap: anywhere; }
.task-t em { font-style: normal; font-weight: 500; font-size: 12px; color: var(--muted); }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg button {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  min-height: 42px;
  border: 1.5px solid var(--line);
  background: var(--surface);
  border-radius: 12px;
  font-weight: 700; font-size: 13.5px;
}
.seg svg { width: 17px; height: 17px; }
.seg .ok[aria-pressed="true"] { background: var(--pos); border-color: var(--pos); color: var(--on-solid); }
.seg .no[aria-pressed="true"] { background: var(--neg); border-color: var(--neg); color: var(--on-solid); }
.seg .ok:not([aria-pressed="true"]) { color: var(--pos); }
.seg .no:not([aria-pressed="true"]) { color: var(--neg); }

.del {
  border: 1px solid var(--neg); color: var(--neg); background: transparent;
  border-radius: 8px; padding: 2px 10px; font-size: 12.5px; min-height: 32px; white-space: nowrap;
}
.del.sure { background: var(--neg); color: var(--on-solid); }

form.add { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.inp {
  min-width: 0; min-height: 46px;
  border: 1.5px solid var(--line); border-radius: 12px;
  padding: 6px 12px; background: var(--bg);
}
.inp::placeholder { color: var(--muted); }
.btn {
  min-height: 46px; border: 0; border-radius: 12px;
  padding: 6px 18px; font-weight: 700;
  background: var(--accent); color: #fff;
  box-shadow: 0 3px 10px rgba(123,94,167,.25);
}
.btn:active { transform: scale(.98); }
.btn.alt {
  background: transparent; color: var(--accent);
  border: 1.5px solid var(--accent); box-shadow: none;
}
.btn.pink { background: var(--pink); box-shadow: 0 3px 10px rgba(232,154,184,.3); }

.type { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.type button {
  min-height: 42px; border-radius: 12px;
  border: 1.5px solid var(--line); background: transparent;
  font-weight: 700; color: var(--muted);
}
.type .tp[aria-pressed="true"] { background: var(--pos-soft); border-color: var(--pos); color: var(--pos); }
.type .tn[aria-pressed="true"] { background: var(--neg-soft); border-color: var(--neg); color: var(--neg); }

.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  border: 1.5px dashed var(--line); background: transparent;
  border-radius: 99px; padding: 4px 13px;
  font-size: 13px; min-height: 34px;
}
.chip:hover { border-style: solid; border-color: var(--accent); color: var(--accent); }

.note {
  display: grid; grid-template-columns: auto 1fr auto;
  gap: 10px; align-items: center;
  padding: 8px 0; border-top: 1px solid var(--line);
}
.note:first-child { border-top: 0; }
.pill {
  width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center;
  font-weight: 800; font-size: 16px; line-height: 1;
}
.pill.p { background: var(--pos-soft); color: var(--pos); }
.pill.n { background: var(--neg-soft); color: var(--neg); }
.note-t { min-width: 0; overflow-wrap: anywhere; }
.note-t small { display: block; color: var(--muted); font-size: 12px; line-height: 1.3; }

.parent-task {
  display: grid; gap: 6px;
  padding: 12px 14px;
  border: 1.5px dashed var(--pink);
  border-radius: 14px;
  background: var(--pink-soft);
}
.parent-task .pt-title { font-weight: 700; font-size: 14.5px; }
.parent-task .pt-meta { font-size: 12.5px; color: var(--muted); }
.parent-task.done { border-style: solid; border-color: var(--pos); background: var(--pos-soft); }

.reward {
  display: grid; grid-template-columns: 1fr auto auto;
  gap: 8px; align-items: center;
  padding: 10px 0; border-top: 1px solid var(--line);
}
.reward:first-child { border-top: 0; }
.reward .r-t { min-width: 0; overflow-wrap: anywhere; font-weight: 700; }
.reward .r-t small { display: block; font-weight: 500; color: var(--muted); font-size: 12.5px; line-height: 1.4; }
.claim-btn {
  min-height: 40px; border: 0; border-radius: 11px;
  padding: 4px 14px; font-weight: 700;
  background: var(--accent); color: #fff;
}
.claim-btn:disabled { background: var(--line); color: var(--muted); cursor: default; }

.unlock-banner {
  background: linear-gradient(135deg, var(--pink-soft), var(--accent-soft));
  border: 1.5px solid var(--pink);
  border-radius: var(--r);
  padding: 14px 16px;
  text-align: center;
  display: grid; gap: 8px;
}
.unlock-banner strong { color: var(--accent-deep); font-size: 15.5px; }
.unlock-banner p { margin: 0; font-size: 13.5px; color: var(--muted); }

.week {
  display: grid; gap: 8px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--surface);
  box-shadow: var(--shadow);
}
.rate { display: grid; gap: 4px; }
.rate-h { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; }
.bar { height: 9px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--pink)); border-radius: 99px; }
.goal-done { color: var(--pos); font-weight: 700; }

.range { display: flex; gap: 6px; flex-wrap: wrap; }
.chart { display: flex; gap: 3px; direction: rtl; padding-top: 4px; }
.col {
  flex: 1; min-width: 0; padding: 0; border: 0; background: transparent;
  display: grid; grid-template-rows: 56px 56px auto;
}
.up, .down { display: flex; }
.up { align-items: flex-end; }
.down { align-items: flex-start; border-top: 1px solid var(--muted); }
.up i, .down i { display: block; width: 100%; border-radius: 3px; }
.up i { background: var(--pos); }
.down i { background: var(--neg); }
.col .lbl {
  font-size: 10.5px; text-align: center; color: var(--muted);
  height: 18px; line-height: 18px; white-space: nowrap;
}
.col.today .lbl { color: var(--accent); font-weight: 800; }
.legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--muted); }
.legend span::before {
  content: ""; display: inline-block; width: 10px; height: 10px;
  border-radius: 3px; margin-inline-end: 6px; vertical-align: -1px;
}
.legend .lp::before { background: var(--pos); }
.legend .ln::before { background: var(--neg); }

.dayrow {
  display: grid; grid-template-columns: 1fr auto auto auto;
  gap: 12px; align-items: center; width: 100%; text-align: start;
  padding: 10px 0; background: transparent; border: 0;
  border-top: 1px solid var(--line); min-height: 46px;
}
.dayrow:first-child { border-top: 0; }
.dayrow .t { color: var(--muted); font-size: 13px; }
.dayrow .p { color: var(--pos); font-weight: 700; }
.dayrow .n { color: var(--neg); font-weight: 700; }

.status { font-size: 13px; color: var(--muted); text-align: center; margin: 0; }
.status.err { color: var(--neg); font-weight: 700; }
.empty { text-align: center; padding: 12px 0; }

.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(45,27,78,.45);
  display: grid; place-items: center;
  z-index: 100; padding: 20px;
}
.modal {
  background: var(--surface);
  border-radius: 22px;
  padding: 24px 20px;
  width: min(340px, 100%);
  display: grid; gap: 14px;
  box-shadow: 0 12px 40px rgba(0,0,0,.2);
  text-align: center;
}
.modal h3 { margin: 0; font-size: 18px; }
.modal p { margin: 0; font-size: 13.5px; color: var(--muted); }
.pin-row { display: flex; gap: 8px; justify-content: center; }
.pin-row input {
  width: 48px; height: 52px; text-align: center;
  font-size: 22px; font-weight: 800;
  border: 2px solid var(--line); border-radius: 12px;
  background: var(--bg);
}
.pin-row input:focus { border-color: var(--accent); }

.foot {
  display: grid; gap: 10px;
  padding-top: 4px;
}
.foot-actions {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
}
.rule { font-size: 12.5px; color: var(--muted); margin: 0; text-align: center; }

.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%);
  background: var(--accent-deep);
  color: #fff;
  padding: 12px 20px;
  border-radius: 99px;
  font-weight: 700; font-size: 14px;
  box-shadow: 0 6px 20px rgba(92,61,138,.35);
  z-index: 200;
  animation: pop .35s ease;
  max-width: 90%;
  text-align: center;
}
@keyframes pop {
  from { opacity: 0; transform: translateX(-50%) translateY(12px) scale(.95); }
  to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
}

form.add3 { display: grid; grid-template-columns: 1fr 84px auto; gap: 8px; }
.ta {
  width: 100%; direction: ltr; text-align: left;
  font-family: ui-monospace, Consolas, monospace;
  font-size: 12px; line-height: 1.5; resize: vertical;
}
a.btn { display: grid; place-items: center; text-decoration: none; }

@media (prefers-reduced-motion: reduce) {
  main { transition: none; }
  .toast { animation: none; }
}
</style>
</head>

<div id="app" dir="rtl"></div>
