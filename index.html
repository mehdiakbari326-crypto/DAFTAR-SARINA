.foot{display:grid;gap:10px;padding-top:4px}.foot-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.rule{font-size:12px;color:var(--muted);margin:0;text-align:center}
.datebar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:18px}

.range-btns{display:flex;gap:6px;flex-wrap:wrap}.range-btns button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;font-size:12.5px;font-weight:700}
.range-btns button.active{background:var(--accent);color:#fff;border-color:var(--accent)}

<script>
document.documentElement.setAttribute('dir','rtl');
const firebaseConfig={apiKey:"AIzaSyBvQEV428AMGvYa6Ztkqxzm3K_iLcZAqm0",authDomain:"sarina-daftar.firebaseapp.com",databaseURL:"https://sarina-daftar-default-rtdb.firebaseio.com",projectId:"sarina-daftar",storageBucket:"sarina-daftar.firebasestorage.app",messagingSenderId:"912685467959",appId:"1:912685467959:web:bef6f3cf3ee6f8f25432b2",measurementId:"G-LGLGCM8KWX"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const FAMILY_PATH='family/sarina';
var PRESET_TASKS=['مسواک زدن صبح','مسواک زدن شب','انجام تکالیف مدرسه','مرتب کردن اتاق','جمع کردن تخت','کتاب خواندن ۲۰ دقیقه'];

var PRESET_NEG=['دروغ گفتن','بی‌احترامی','لجبازی','دعوا کردن','حرف گوش نکردن'];
var PRESET_PARENT=['باهام قصه بخون','باهام بازی کن','منو ببر پارک','باهم فیلم ببینیم','بستنی بخوریم'];
var MOTIVATE=['آفرین سارینا! تو فوق‌العاده‌ای 💜','وای چه دختر زرنگی! ستاره گرفتی ✨','ادامه‌ش بده قهرمانم! 🌟','سارینا جون، عالی پیش میری 💕','اینم از تو! خیلی خوشحال شدم 🌸','تو ستاره منی! ⭐','چه دختر باهوشی! 🦄'];
var PRESET_REWARDS=[{t:'انتخاب فیلم شب',c:6},{t:'بستنی',c:8},{t:'یک ساعت بازی',c:10},{t:'گردش آخر هفته',c:25}];
var LEVELS=[{min:0,name:'ستاره کوچک',icon:'⭐',next:10},{min:10,name:'شاهزاده خانم',icon:'👑',next:25},{min:25,name:'قهرمان بنفش',icon:'🦄',next:50},{min:50,name:'فرشته مهربان',icon:'🧚',next:80},{min:80,name:'ملکه ستاره‌ها',icon:'🌟',next:120},{min:120,name:'افسانه سارینا',icon:'💎',next:9999}];
var THEMES=[{id:'unicorn',name:'یونیکورن',icon:'🦄'},{id:'princess',name:'شاهزاده',icon:'👑'},{id:'ocean',name:'اقیانوس',icon:'🐬'},{id:'forest',name:'جنگل',icon:'🌿'}];
var CHARACTERS=[{emoji:'🦄',name:'یونیکورن'},{emoji:'🐰',name:'خرگوش'},{emoji:'🐱',name:'گربه'},{emoji:'🐻',name:'تدی'},{emoji:'🦊',name:'روباه'},{emoji:'🐼',name:'پاندا'},{emoji:'🦋',name:'پروانه'},{emoji:'🌟',name:'ستاره'}];
function pad(n){return String(n).padStart(2,'0')}
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fromKey(k){var p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12)}
function addDays(k,n){var d=fromKey(k);d.setDate(d.getDate()+n);return keyOf(d)}
function todayKey(){return keyOf(new Date())}
function fa(n){return Number(n).toLocaleString('fa-IR')}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]})}
function mkFmt(o){try{return new Intl.DateTimeFormat('fa-IR-u-ca-persian',o)}catch(e){return new Intl.DateTimeFormat('fa-IR',o)}}
var fmtFull=mkFmt({weekday:'long',day:'numeric',month:'long',year:'numeric'});
var fmtShort=mkFmt({weekday:'short',day:'numeric'});
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function fmtSigned(n){return(n>0?'+':'')+fa(n)}
function toNum(s){var m=String(s||'').replace(/[۰-۹]/g,function(c){return c.charCodeAt(0)-1776}).replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632});var n=parseInt(m,10);return isNaN(n)?0:Math.max(0,Math.min(9999,n))}
function toEnDigits(s){return String(s||'').replace(/[۰-۹]/g,function(c){return String(c.charCodeAt(0)-1776)}).replace(/[٠-٩]/g,function(c){return String(c.charCodeAt(0)-1632)})}
var S={name:'سارینا',tasks:[],days:{},rewards:[],claims:[],goal:15,parentTasks:[],parentPin:'1234',posBehaviors:[],negBehaviors:[],streak:0,lastActive:'',theme:'unicorn'};
var view='today',curKey=todayKey(),draftType='pos',draftText='',isParent=false,showPinModal=false,toastMsg='',toastTimer=null,syncStatus='connecting',ignoreRemote=false,reportRange=7;
var app=document.getElementById('app');var LS='daftar-sarina-v5';
function applyTheme(){document.documentElement.setAttribute('data-theme',S.theme||'unicorn')}
function lsLoad(){try{var j=JSON.parse(localStorage.getItem(LS));if(j){Object.assign(S,{name:j.name||'سارینا',tasks:j.tasks||[],days:j.days||{},rewards:j.rewards||[],claims:j.claims||[],goal:j.goal||15,parentTasks:j.parentTasks||[],parentPin:j.parentPin||'1234',posBehaviors:j.posBehaviors||[],negBehaviors:j.negBehaviors||[],streak:j.streak||0,lastActive:j.lastActive||'',theme:j.theme||'unicorn'})}applyTheme()}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function saveProfile(){lsSave();if(db){ignoreRemote=true;db.ref(FAMILY_PATH).set(S).then(function(){ignoreRemote=false;syncStatus='online';updateSyncDot()}).catch(function(){ignoreRemote=false;syncStatus='offline';updateSyncDot()})}}
function startFirebaseSync(){db.ref(FAMILY_PATH).on('value',function(snap){if(ignoreRemote)return;var r=snap.val();if(r){Object.assign(S,{name:r.name||S.name,tasks:r.tasks||S.tasks,days:r.days||S.days,rewards:r.rewards||S.rewards,claims:r.claims||S.claims,goal:r.goal||S.goal,parentTasks:r.parentTasks||S.parentTasks,parentPin:r.parentPin||S.parentPin,posBehaviors:r.posBehaviors||S.posBehaviors,negBehaviors:r.negBehaviors||S.negBehaviors,streak:r.streak||S.streak,lastActive:r.lastActive||S.lastActive,theme:r.theme||S.theme});applyTheme();lsSave();render()}syncStatus='online';updateSyncDot()},function(){syncStatus='offline';updateSyncDot()})}
function updateSyncDot(){var el=document.getElementById('syncDot');if(el)el.className='sync-dot '+(syncStatus==='online'?'on':syncStatus==='offline'?'off':'')}
function getDay(k){return S.days[k]||{tasks:{},notes:[]}}
function mutDay(k,fn){var d=JSON.parse(JSON.stringify(getDay(k)));d.tasks=d.tasks||{};d.notes=d.notes||[];fn(d);S.days[k]=d;updateStreak();saveProfile();render()}
function dayTaskList(k){var rec=getDay(k).tasks||{};return S.tasks.map(function(t){return{id:t.id,title:t.title,s:rec[t.id]&&rec[t.id].s}})}
function dayStats(k){var list=dayTaskList(k);var d=getDay(k);var done=list.filter(function(t){return t.s==='done'}).length;var missed=list.filter(function(t){return t.s==='missed'}).length;var pos=(d.notes||[]).filter(function(n){return n.type==='pos'}).length;var neg=(d.notes||[]).filter(function(n){return n.type==='neg'}).length;return{done:done,missed:missed,pos:pos,neg:neg}}
function score(s){return (s.done||0)+(s.pos||0)-(s.missed||0)-(s.neg||0)}
function totalScore(){var t=0;Object.keys(S.days).forEach(function(k){t+=score(dayStats(k))});return t}
function weekScore(){var t=0;for(var i=0;i<7;i++)t+=score(dayStats(addDays(todayKey(),-i)));return t}
function availablePoints(){return Math.max(0,totalScore()-(S.claims||[]).reduce(function(a,c){return a+(c.c||0)},0))}
function getPosBehaviors(){return(S.posBehaviors&&S.posBehaviors.length)?S.posBehaviors:PRESET_POS.slice()}

function render(){var foot='<div class="foot"><div class="foot-actions">';if(isParent)foot+='<button type="button" class="ghost" data-act="exit-parent">خروج والدین</button>';else foot+='<button type="button" class="ghost" data-act="enter-parent">🔒 ورود والدین</button>';foot+='</div><p class="rule">دفتر روزانه سارینا • ساخته‌شده با 💜</p></div>';var body=view==='today'?todayView():view==='report'?reportView():view==='rewards'?rewardsView():view==='settings'?settingsView():parentView();app.innerHTML='<div class="shell">'+header()+'<main>'+body+'</main>'+foot+'</div>'+pinModal()+(toastMsg?'<div class="toast">'+esc(toastMsg)+'</div>':'');updateSyncDot();if(showPinModal){setTimeout(function(){var p1=document.getElementById('pin1'),p2=document.getElementById('pin2'),p3=document.getElementById('pin3'),p4=document.getElementById('pin4');var pins=[p1,p2,p3,p4];pins.forEach(function(el,i){if(!el)return;el.addEventListener('input',function(){var v=toEnDigits(el.value).replace(/[^0-9]/g,'').slice(-1);el.value=v;if(v&&i<3&&pins[i+1])pins[i+1].focus()});el.addEventListener('keydown',function(e){if(e.key==='Backspace'&&!el.value&&i>0)pins[i-1].focus()})});var submitBtn=document.getElementById('pinSubmit');if(submitBtn)submitBtn.onclick=function(){var code=toEnDigits((p1&&p1.value||'')+(p2&&p2.value||'')+(p3&&p3.value||'')+(p4&&p4.value||''));var err=document.getElementById('pinErr');if(code.length<4){if(err){err.style.display='block';err.textContent='هر ۴ رقم را وارد کنید'}return}if(code===String(S.parentPin||'1234')){isParent=true;showPinModal=false;showToast('خوش آمدید والدین 💜');render()}else{if(err){err.style.display='block';err.textContent='رمز اشتباه است'}pins.forEach(function(el){if(el)el.value=''});if(p1)p1.focus()}};var cancelBtn=document.getElementById('pinCancel');if(cancelBtn)cancelBtn.onclick=function(){showPinModal=false;render()};var backdrop=document.getElementById('pinBackdrop');if(backdrop)backdrop.onclick=function(e){if(e.target===backdrop){showPinModal=false;render()}};if(p1)p1.focus()},30)}}
document.addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(!t||!app.contains(t))return;e.preventDefault();var a=t.getAttribute('data-act'),d=t.dataset;if(a==='view'){view=d.v;render();return}if(a==='day'){curKey=addDays(curKey,+d.n);render();return}if(a==='range'){reportRange=+d.n;render();return}if(a==='type'){draftType=d.t;render();return}if(a==='theme'){S.theme=d.t;applyTheme();saveProfile();render();return}if(a==='mark'){mutDay(curKey,function(day){if(!day.tasks[d.id])day.tasks[d.id]={t:(S.tasks.find(function(x){return x.id===d.id})||{}).title||''};if(day.tasks[d.id].s===d.s)delete day.tasks[d.id].s;else day.tasks[d.id].s=d.s});if(d.s==='done'){var msg=MOTIVATE[Math.floor(Math.random()*MOTIVATE.length)];showToast(msg);celebrate()}return}if(a==='del-note'){mutDay(curKey,function(day){day.notes=(day.notes||[]).filter(function(n){return n.id!==d.id})});return}if(a==='chip'){draftText=d.t;var ni=document.getElementById('noteIn');if(ni)ni.value=d.t;return}if(a==='claim'){var rew=S.rewards.find(function(r){return r.id===d.id});if(!rew||availablePoints()<rew.c)return;S.claims=S.claims||[];S.claims.push({id:rew.id,t:rew.t,c:rew.c,k:todayKey()});saveProfile();showToast('پاداش دریافت شد! 🎁');celebrate();render();return}if(a==='chip-parent'){var pi=document.getElementById('parentIn');if(pi)pi.value=d.t;return}if(a==='done-parent'){var pt=S.parentTasks.find(function(p){return p.id===d.id});if(pt){pt.done=true;saveProfile();showToast('آفرین!');render()}return}if(a==='enter-parent'){showPinModal=true;render();return}if(a==='exit-parent'){isParent=false;showToast('حالت سارینا 🦄');render();return}if(a==='change-pin'){var np=prompt('رمز جدید ۴ رقمی:');if(np===null)return;np=toEnDigits(np).replace(/[^0-9]/g,'');if(np.length!==4){showToast('باید ۴ رقم باشد');return}S.parentPin=np;saveProfile();showToast('رمز تغییر کرد');return}if(a==='del-task-perm'){if(confirm('این تسک حذف شود؟')){S.tasks=S.tasks.filter(function(t){return t.id!==d.id});saveProfile();render()}return}if(a==='del-reward'){if(confirm('این پاداش حذف شود؟')){S.rewards=S.rewards.filter(function(r){return r.id!==d.id});saveProfile();render()}return}if(a==='chip-task-set'){if(d.t&&!S.tasks.some(function(t){return t.title===d.t})){S.tasks.push({id:uid(),title:d.t});saveProfile();render()}return}if(a==='del-pos'){var list=getPosBehaviors().slice();list.splice(+d.i,1);S.posBehaviors=list;saveProfile();render();return}if(a==='del-neg'){var list2=getNegBehaviors().slice();list2.splice(+d.i,1);S.negBehaviors=list2;saveProfile();render();return}if(a==='chip-rew-set'){S.rewards.push({id:uid(),t:d.t,c:+d.c||5});saveProfile();render();return}},true);
app.addEventListener('submit',function(e){e.preventDefault();var form=e.target;if(form.id==='noteForm'){var txt=(document.getElementById('noteIn').value||'').trim();if(!txt)return;mutDay(curKey,function(day){day.notes=day.notes||[];day.notes.push({id:uid(),t:txt,type:draftType,ts:Date.now()})});draftText='';if(draftType==='pos'){showToast(MOTIVATE[Math.floor(Math.random()*MOTIVATE.length)]);celebrate()}return}if(form.id==='parentForm'){var pt=(document.getElementById('parentIn').value||'').trim();if(!pt)return;if(weekScore()<(S.goal||15)){showToast('هنوز به هدف نرسیدی');return}S.parentTasks=S.parentTasks||[];S.parentTasks.unshift({id:uid(),t:pt,k:todayKey(),done:false});saveProfile();showToast('کار ثبت شد 💝');render();return}if(form.id==='taskFormSet'){var title=(document.getElementById('taskInSet').value||'').trim();if(!title)return;S.tasks.push({id:uid(),title:title});saveProfile();render();return}if(form.id==='rewardFormSet'){var rt=(document.getElementById('rewInSet').value||'').trim();var rc=toNum(document.getElementById('costInSet').value);if(!rt||!rc)return;S.rewards.push({id:uid(),t:rt,c:rc});saveProfile();render();return}if(form.id==='posFormSet'){var t=(document.getElementById('posInSet').value||'').trim();if(!t)return;var list=getPosBehaviors().slice();if(list.indexOf(t)===-1)list.push(t);S.posBehaviors=list;saveProfile();render();return}if(form.id==='negFormSet'){var t2=(document.getElementById('negInSet').value||'').trim();if(!t2)return;var list2=getNegBehaviors().slice();if(list2.indexOf(t2)===-1)list2.push(t2);S.negBehaviors=list2;saveProfile();render();return}if(form.id==='goalFormSet'){var g=toNum(document.getElementById('goalInSet').value);if(g>=5){S.goal=g;saveProfile();showToast('هدف ذخیره شد');render()}return}});
app.addEventListener('change',function(e){if(e.target.id==='nameIn'&&isParent){S.name=e.target.value.trim()||'سارینا';saveProfile()}});
lsLoad();if(!S.tasks.length){S.tasks=[{id:uid(),title:'مسواک زدن صبح'},{id:uid(),title:'مسواک زدن شب'},{id:uid(),title:'انجام تکالیف'},{id:uid(),title:'مرتب کردن اتاق'}];lsSave()}updateStreak();render();startFirebaseSync();
</script>
