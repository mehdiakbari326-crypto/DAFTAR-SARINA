name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compute version
        id: ver
        run: |
          CODE=$((2000 + ${{ github.run_number }}))
          NAME="1.${{ github.run_number }}"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "VersionName=$NAME versionCode=$CODE"

      - name: Prepare web files
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.ver.outputs.name }}
          APP_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          set -e
          mkdir -p www
          cp index.html www/index.html
          for f in app2.js role-hard.js approve-fix.js enhance.js weight.js persist-guard.js settings-ui.js sync-fix.js health-ui.js report-fix.js; do
            if [ -f "$f" ]; then cp "$f" "www/$f"; echo "copied $f"; fi
          done
          BLOB_SHA="25a039f0a5ae4cee254e40e37f7a4445ab664e47"
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${BLOB_SHA}" --jq .content | base64 -d > www/app.js
          test "$(wc -c < www/app.js)" -gt 10000
          printf "%s\n" "window.APP_VERSION='${APP_VERSION}';" "window.APP_VERSION_CODE=${APP_VERSION_CODE};" "(function(){function p(){try{var v=window.APP_VERSION||'?';document.querySelectorAll('.rule').forEach(function(el){if(el&&el.textContent.indexOf('v')<0){el.textContent=el.textContent+' • v'+v}});var h1=document.querySelector('.hero h1,.fun-hero h1');if(h1&&!document.getElementById('verBadge')){var b=document.createElement('span');b.id='verBadge';b.textContent='v'+v;b.style.cssText='margin-right:8px;font-size:11px;opacity:.9;background:rgba(255,255,255,.25);padding:2px 8px;border-radius:99px;font-weight:800';h1.appendChild(b);}}catch(e){}}setTimeout(p,500);setTimeout(p,1500);setInterval(p,4000);})();" > www/version.js
          grep -q 'version.js' www/index.html || sed -i 's|</body>|<script src="version.js"></script>\n</body>|' www/index.html
          grep -q 'report-fix.js' www/index.html || sed -i 's|</body>|<script src="report-fix.js"></script>\n</body>|' www/index.html
          ls -la www/

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Configure version and signing
        env:
          APP_VERSION: ${{ steps.ver.outputs.name }}
          APP_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          set -e
          mkdir -p android/app
          if [ -f debug.keystore.b64 ]; then
            base64 -d debug.keystore.b64 > android/app/debug.keystore
            echo "keystore ready"
          else
            echo "WARNING: no fixed keystore"
          fi
          GRADLE=android/app/build.gradle
          test -f "$GRADLE"
          sed -i 's/applicationId .*/applicationId "com.daftar.roozane"/' "$GRADLE"
          if grep -q versionCode "$GRADLE"; then
            sed -i "s/versionCode .*/versionCode ${APP_VERSION_CODE}/" "$GRADLE"
          else
            sed -i "/applicationId/a\        versionCode ${APP_VERSION_CODE}" "$GRADLE"
          fi
          if grep -q versionName "$GRADLE"; then
            sed -i "s/versionName .*/versionName \"${APP_VERSION}\"/" "$GRADLE"
          else
            sed -i "/versionCode/a\        versionName \"${APP_VERSION}\"" "$GRADLE"
          fi
          printf '%s\n' \
            'android {' \
            '    signingConfigs {' \
            '        fixedDebug {' \
            '            storeFile file("debug.keystore")' \
            '            storePassword "android"' \
            '            keyAlias "androiddebugkey"' \
            '            keyPassword "android"' \
            '        }' \
            '    }' \
            '    buildTypes {' \
            '        debug {' \
            '            signingConfig signingConfigs.fixedDebug' \
            '        }' \
            '    }' \
            '}' \
            > android/app/signing.gradle
          grep -q "signing.gradle" "$GRADLE" || echo "apply from: 'signing.gradle'" >> "$GRADLE"
          grep -A20 defaultConfig "$GRADLE" || true

      - name: Add notification permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ] && ! grep -q POST_NOTIFICATIONS "$MANIFEST"; then
            sed -i 's|<application|    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <application|' "$MANIFEST"
          fi

      - name: App icon
        run: |
          pip install pillow
          python3 make_icons.py android/app/src/main/res

      - name: Sync web files
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK with version
        env:
          APP_VERSION: ${{ steps.ver.outputs.name }}
        run: |
          SRC=android/app/build/outputs/apk/debug/app-debug.apk
          OUT=android/app/build/outputs/apk/debug/daftar-sarina-v${APP_VERSION}.apk
          cp "$SRC" "$OUT"
          ls -la android/app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daftar-sarina-v${{ steps.ver.outputs.name }}
          path: android/app/build/outputs/apk/debug/daftar-sarina-v${{ steps.ver.outputs.name }}.apk
