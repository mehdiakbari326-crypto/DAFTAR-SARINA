name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html
          if [ -f app.js ]; then cp app.js www/app.js; fi
          ls -la www/

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Add notification permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # POST_NOTIFICATIONS for Android 13+
            if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
              sed -i 's|<manifest |<manifest |' "$MANIFEST"
              python3 - <<'PY'
import re
path = "android/app/src/main/AndroidManifest.xml"
with open(path, encoding="utf-8") as f:
    s = f.read()
perms = '''    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
    <uses-permission android:name="android.permission.VIBRATE" />
'''
if "POST_NOTIFICATIONS" not in s:
    s = s.replace("<application", perms + "    <application", 1)
    with open(path, "w", encoding="utf-8") as f:
        f.write(s)
    print("permissions added")
else:
    print("permissions already present")
PY
            fi
            cat "$MANIFEST" | head -40
          fi

      - name: App icon
        run: |
          pip install pillow
          python3 make_icons.py android/app/src/main/res

      - name: Sync web files
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daftar-roozane-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
