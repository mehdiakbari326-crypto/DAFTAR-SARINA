name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p www
          cp index.html www/index.html
          for f in app2.js role-hard.js approve-fix.js enhance.js weight.js; do
            if [ -f "$f" ]; then cp "$f" "www/$f"; echo "copied $f"; fi
          done
          BLOB_SHA="25a039f0a5ae4cee254e40e37f7a4445ab664e47"
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${BLOB_SHA}" --jq .content | base64 -d > www/app.js
          echo "app.js size: $(wc -c < www/app.js)"
          if [ "$(wc -c < www/app.js)" -lt 10000 ]; then
            echo "app.js too small"
            exit 1
          fi
          ls -la www/

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Add notification permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
              sed -i 's|<application|    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <application|' "$MANIFEST"
            fi
          fi

      - name: App icon
        run: |
          pip install pillow
          python3 make_icons.py android/app/src/main/res

      - name: Sync web files
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daftar-roozane-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
