name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compute version
        id: ver
        run: |
          CODE=2211
          NAME="3.1"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare web files
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.ver.outputs.name }}
          APP_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          set -e
          mkdir -p www
          cp index.html www/index.html
          for f in app2.js role-hard.js approve-fix.js enhance.js weight.js persist-guard.js settings-ui.js sync-fix.js health-ui.js report-fix.js ui-polish.js behavior-tasks.js cloud-config.js sarina-play.js display-fix.js cheer-gate.js features-v27.js patch-v271.js fix-v28.js health-sync-v29.js fix-v30.js sync-resilience-v31.js; do
            if [ -f "$f" ]; then cp "$f" "www/$f"; echo "copied $f"; fi
          done

          BLOB_SHA="585efac004c605bf4f15e3e116151ab98a3c17fd"
          if [ -f app.js ] && [ "$(wc -c < app.js)" -gt 40000 ]; then
            cp app.js www/app.js
            echo "using local app.js"
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${BLOB_SHA}" --jq .content | base64 -d > www/app.js
            echo "using full blob app.js"
          fi

          test "$(wc -c < www/app.js)" -gt 40000
          grep -q "updateStreak();render();startFirebaseSync();" www/app.js
          grep -q "rolePickerHtml" www/app.js
          test -f www/display-fix.js
          test -f www/cheer-gate.js
          test -f www/fix-v28.js
          test -f www/health-sync-v29.js
          test -f www/fix-v30.js
          test -f www/sync-resilience-v31.js
          grep -q 'do NOT restore longer' www/sync-fix.js

          python3 - <<'PY'
          from pathlib import Path
          p = Path('www/app.js')
          t = p.read_text(encoding='utf-8')
          t = t.replace('firebase.initializeApp(firebaseConfig)', 'null')
          t = t.replace('db=firebase.database()', 'db=null')
          t = t.replace('db = firebase.database()', 'db=null')

          def replace_fn(src, name, new_body):
              key = 'function ' + name + '(){'
              i = src.find(key)
              if i < 0:
                  return src
              depth = 0
              for k in range(i, len(src)):
                  if src[k] == '{':
                      depth += 1
                  elif src[k] == '}':
                      depth -= 1
                      if depth == 0:
                          return src[:i] + 'function ' + name + '(){' + new_body + '}' + src[k+1:]
              return src

          t = replace_fn(t, 'saveProfile', "lsSave();try{syncStatus='online';updateSyncDot()}catch(e){}")
          t = replace_fn(t, 'startFirebaseSync', "try{syncStatus='online';updateSyncDot()}catch(e){}")

          old = "if(d.s==='done'){showToast(MOTIVATE[Math.floor(Math.random()*MOTIVATE.length)]);celebrate();if(deviceRole==='child'&&!isParent)notifyTaskDone(title)}"
          new = "if(d.s==='done'){if(deviceRole==='child'){showToast(MOTIVATE[Math.floor(Math.random()*MOTIVATE.length)]);celebrate();notifyTaskDone(title)}else{showToast('ثبت شد ✓')}}"
          if old in t:
              t = t.replace(old, new)
              print('motivate gated')
          else:
              print('motivate pattern missing')

          if 'window.APP_VERSION' not in t:
              t = "window.APP_VERSION=window.APP_VERSION||'3.1';\n" + t
          p.write_text(t, encoding='utf-8')
          print('patched app.js', p.stat().st_size)
          PY

          node --check www/app.js
          test "$(wc -c < www/app.js)" -gt 35000

          printf "%s\n" "window.APP_VERSION='${APP_VERSION}';" "window.APP_VERSION_CODE=${APP_VERSION_CODE};" "(function(){function p(){try{var v=window.APP_VERSION||'?';document.querySelectorAll('.rule').forEach(function(el){if(el&&el.textContent.indexOf('v')<0){el.textContent=el.textContent+' • v'+v}});var h1=document.querySelector('.hero h1,.fun-hero h1');if(h1&&!document.getElementById('verBadge')){var b=document.createElement('span');b.id='verBadge';b.textContent='v'+v;b.style.cssText='margin-right:8px;font-size:11px;opacity:.9;background:rgba(255,255,255,.25);padding:2px 8px;border-radius:99px;font-weight:800';h1.appendChild(b);}}catch(e){}}setTimeout(p,500);setTimeout(p,1500);})();" > www/version.js
          grep -q 'version.js' www/index.html || sed -i 's|</body>|<script src="version.js"></script>\n</body>|' www/index.html
          ls -la www/
          echo "APP_BYTES=$(wc -c < www/app.js)"

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Configure version and signing
        env:
          APP_VERSION: ${{ steps.ver.outputs.name }}
          APP_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          set -e
          mkdir -p android/app
          if [ -f debug.keystore.b64 ]; then base64 -d debug.keystore.b64 > android/app/debug.keystore; fi
          GRADLE=android/app/build.gradle
          test -f "$GRADLE"
          sed -i 's/applicationId .*/applicationId "com.daftar.roozane"/' "$GRADLE"
          if grep -q versionCode "$GRADLE"; then sed -i "s/versionCode .*/versionCode ${APP_VERSION_CODE}/" "$GRADLE"; else sed -i "/applicationId/a\        versionCode ${APP_VERSION_CODE}" "$GRADLE"; fi
          if grep -q versionName "$GRADLE"; then sed -i "s/versionName .*/versionName \"${APP_VERSION}\"/" "$GRADLE"; else sed -i "/versionCode/a\        versionName \"${APP_VERSION}\"/" "$GRADLE"; fi
          printf '%s\n' 'android {' '    signingConfigs {' '        fixedDebug {' '            storeFile file("debug.keystore")' '            storePassword "android"' '            keyAlias "androiddebugkey"' '            keyPassword "android"' '        }' '    }' '    buildTypes {' '        debug {' '            signingConfig signingConfigs.fixedDebug' '        }' '    }' '}' > android/app/signing.gradle
          grep -q "signing.gradle" "$GRADLE" || echo "apply from: 'signing.gradle'" >> "$GRADLE"

      - name: Add notification permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ] && ! grep -q POST_NOTIFICATIONS "$MANIFEST"; then
            sed -i 's|<application|    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <application|' "$MANIFEST"
          fi

      - name: App icon
        run: |
          pip install pillow
          python3 make_icons.py android/app/src/main/res

      - name: Sync web files
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK with version
        env:
          APP_VERSION: ${{ steps.ver.outputs.name }}
        run: |
          SRC=android/app/build/outputs/apk/debug/app-debug.apk
          OUT=android/app/build/outputs/apk/debug/daftar-sarina-v${APP_VERSION}.apk
          cp "$SRC" "$OUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daftar-sarina-v${{ steps.ver.outputs.name }}
          path: android/app/build/outputs/apk/debug/daftar-sarina-v${{ steps.ver.outputs.name }}.apk
